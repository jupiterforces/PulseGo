<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partner Chat | Pulse Go</title>
    <meta name="description" content="Study Partner chat oynasi.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles/styles.css">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--tg-bg);
            color: var(--tg-text);
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .chat-layout {
            padding: 14px 0 20px;
        }

        .chat-shell {
            background: #fff;
            border: 1px solid #e9eef5;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, .06);
            overflow: hidden;
            min-height: 74vh;
            display: flex;
            flex-direction: column;
        }

        .chat-head {
            padding: 12px 14px;
            border-bottom: 1px solid #eef2f7;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
        }

        .back-btn {
            border: none;
            background: #f1f5f9;
            color: #334155;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-dot {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-title {
            font-size: 14px;
            font-weight: 800;
            margin: 0;
        }

        .chat-meta {
            font-size: 11px;
            color: var(--tg-muted);
            margin: 0;
        }

        .chat-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .chat-actions .btn {
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .messages-wrap {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            background: linear-gradient(180deg, #f8fbff 0%, #f6f8fc 100%);
        }

        .msg-row {
            display: flex;
            margin-bottom: 10px;
        }

        .msg-row.me {
            justify-content: flex-end;
        }

        .msg-bubble {
            max-width: 82%;
            border-radius: 14px;
            padding: 9px 11px;
            font-size: 13px;
            line-height: 1.35;
            box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
            word-break: break-word;
        }

        .msg-row.me .msg-bubble {
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .msg-row.other .msg-bubble {
            background: #fff;
            color: #0f172a;
            border-bottom-left-radius: 6px;
        }

        .msg-time {
            margin-top: 4px;
            font-size: 10px;
            opacity: .75;
            text-align: right;
        }

        .msg-reply {
            border-left: 3px solid rgba(148, 163, 184, .7);
            padding-left: 7px;
            margin-bottom: 6px;
            font-size: 11px;
            opacity: .9;
        }

        .msg-toolbar {
            margin-top: 6px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .msg-tool {
            border: none;
            background: transparent;
            font-size: 10px;
            font-weight: 700;
            color: inherit;
            opacity: .82;
            padding: 0;
        }

        .msg-tool:hover {
            opacity: 1;
        }

        .chat-compose {
            border-top: 1px solid #e2e8f0;
            background: #fff;
            padding: 10px;
        }

        .reply-preview {
            display: none;
            border: 1px solid #dbeafe;
            background: #eff6ff;
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .reply-preview.show {
            display: block;
        }

        .compose-row {
            display: flex;
            gap: 8px;
        }

        .compose-row input {
            border-radius: 999px;
            padding-left: 14px;
            padding-right: 14px;
        }

        .compose-row .btn {
            border-radius: 999px;
            min-width: 44px;
        }

        .welcome-msg {
            border: 1px dashed #cbd5e1;
            border-radius: 14px;
            padding: 14px;
            background: #fff;
        }

        .welcome-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #334155;
        }

        .hidden {
            display: none !important;
        }

        .action-sheet {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1200;
            background: rgba(15, 23, 42, .25);
            display: flex;
            align-items: flex-end;
            padding: 10px;
        }

        .action-sheet-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            background: #fff;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -16px 34px rgba(15, 23, 42, .2);
            padding: 10px;
        }

        .action-btn {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 10px 12px;
            text-align: left;
            color: #0f172a;
        }

        .action-btn.danger {
            color: #b91c1c;
            border-color: #fecaca;
            background: #fef2f2;
        }

        .action-btn.cancel {
            text-align: center;
            color: #334155;
            background: #f8fafc;
        }

        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-questions button {
            border: 1px solid #dbe1ea;
            border-radius: 999px;
            padding: 6px 10px;
            background: #fff;
            font-size: 12px;
            color: #334155;
        }

        @media (max-width: 767.98px) {
            .chat-layout {
                padding: 8px 0 0;
            }

            .container {
                padding-left: 8px;
                padding-right: 8px;
            }

            .chat-shell {
                min-height: calc(100vh - 126px);
                border-radius: 14px;
            }

            .chat-head {
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                padding: 10px;
            }

            .chat-actions {
                width: 100%;
                margin-left: 0;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .chat-actions .btn {
                font-size: 10px;
                padding: 4px 8px;
            }

            .messages-wrap {
                padding: 10px;
            }

            .msg-bubble {
                max-width: 90%;
            }
        }

        @media (min-width: 992px) {
            body {
                padding-bottom: 24px;
            }

            .chat-layout {
                padding-top: 24px;
            }
        }

        /* Professional Modal Styles */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            z-index: 1999;
            animation: fadeIn 0.2s ease-out;
        }

        .professional-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.3);
            max-width: 420px;
            width: 90%;
            z-index: 2000;
            animation: slideInDown 0.3s ease-out;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-actions .btn {
            min-width: 100px;
            border-radius: 8px;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }
    </style>
</head>

<body>
    <nav class="top-navbar">
        <div class="container">
            <a href="/find/" class="btn btn-light btn-sm rounded-pill fw-semibold"><i
                    class="bi bi-arrow-left me-1"></i>Find</a>
            <a href="/" class="nav-logo">
                <img src="/assets/img/PulseGo.jpg" alt="Pulse Go"> Pulse Go
            </a>
            <a href="/profile" class="btn-nav-profile" id="navAvatarBtn">P</a>
        </div>
    </nav>

    <main class="chat-layout">
        <div class="container">
            <section class="chat-shell">
                <div class="chat-head">
                    <button type="button" class="back-btn" id="backBtn"><i class="bi bi-arrow-left"></i></button>
                    <div class="avatar-dot" id="chatAvatar">P</div>
                    <div>
                        <p class="chat-title" id="chatTitle">Partner Chat</p>
                        <p class="chat-meta" id="chatMeta">Yuklanmoqda...</p>
                    </div>
                    <div class="chat-actions">
                        <a href="#" class="btn btn-sm btn-outline-primary disabled" id="contactTelegramBtn">Telegram</a>
                        <a href="#" class="btn btn-sm btn-outline-secondary disabled" id="contactPhoneBtn">Telefon</a>
                        <button type="button" class="btn btn-sm btn-outline-danger" id="deleteChatBtn">Chatni
                            o'chirish</button>
                    </div>
                </div>

                <div class="messages-wrap" id="messagesWrap">
                    <div class="welcome-msg" id="messagesEmpty">
                        <div class="welcome-title">Study Partner bilan suhbatni boshlang:</div>
                        <div class="quick-questions">
                            <button type="button" data-q="Qayerda birga dars qilsak bo'ladi?">Qayerda birga dars qilsak
                                bo'ladi?</button>
                            <button type="button" data-q="Qaysi vaqtlari bo'sh vaqtingiz bor?">Qaysi vaqtlari bo'sh
                                vaqtingiz bor?</button>
                            <button type="button" data-q="Qaysi mavzudan boshlaymiz?">Qaysi mavzudan
                                boshlaymiz?</button>
                        </div>
                    </div>
                </div>

                <form class="chat-compose" id="chatForm">
                    <div class="reply-preview" id="replyPreview">
                        <div class="d-flex justify-content-between align-items-start gap-2">
                            <div>
                                <div class="small fw-bold" id="replyTitle">Javob</div>
                                <div class="small" id="replyText">-</div>
                            </div>
                            <button type="button" class="btn btn-sm btn-light" id="clearReplyBtn">Bekor</button>
                        </div>
                    </div>
                    <div class="compose-row">
                        <input type="text" id="messageInput" class="form-control" placeholder="Xabar yozing..."
                            maxlength="800" disabled>
                        <button class="btn btn-primary" id="sendBtn" type="submit" disabled>
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <div class="action-sheet hidden" id="actionSheet">
        <div class="action-sheet-card">
            <button type="button" class="action-btn" id="actionReplyBtn"><i class="bi bi-reply me-1"></i>Reply</button>
            <button type="button" class="action-btn danger" id="actionDeleteBtn"><i
                    class="bi bi-trash3 me-1"></i>Delete</button>
            <button type="button" class="action-btn cancel" id="actionCancelBtn">Bekor</button>
        </div>
    </div>

    <div id="modalBackdrop" class="modal-backdrop" onclick="closeModal()" style="display: none;"></div>
    <div id="modal" class="professional-modal" style="display: none;">
        <div class="modal-body">
            <h3 id="modalTitle"></h3>
            <p id="modalMessage"></p>
            <div class="modal-actions" id="modalActions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button id="modalConfirmBtn" class="btn btn-primary" onclick="confirmModal()">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="/auth-guard.js"></script>
    <script type="module" src="./chat.js"></script>
</body>

</html>
