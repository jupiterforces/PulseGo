    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ink: #0f172a;
            --ink-2: #475569;
            --ink-3: #94a3b8;
            --line: #e2e8f0;
            --paper: #f6f7f9;
            --card: #fff;
            --good: #16a34a;
            --good-bg: #f0fdf4;
            --mid: #ca8a04;
            --mid-bg: #fefce8;
            --bad: #dc2626;
            --bad-bg: #fef2f2;
            --none: #cbd5e1;
            --pg-bg: #f4f6f8;
            --pg-card: #ffffff;
            --pg-text: #0f172a;
            --pg-muted: #64748b;
            --pg-line: #e8edf2;
            --pg-blue: #2563eb;
            --pg-green: #16a34a;
            --pg-amber: #d97706;
            --pg-red: #dc2626;
            --pg-radius: 14px;
            --pg-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--pg-bg);
            font-family: Inter, system-ui, -apple-system, sans-serif;
            color: var(--pg-text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        .pg-page {
            max-width: 720px;
            margin: 0 auto;
            padding: 1rem 1rem 5.5rem;
        }

        /* Header */
        .pg-hero {
            margin-bottom: 1.15rem;
        }

        .pg-hero-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .pg-hero h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 0.2rem;
            line-height: 1.25;
        }

        .pg-hero p {
            margin: 0;
            font-size: 0.82rem;
            color: var(--pg-muted);
            font-weight: 500;
        }

        .pg-chip {
            flex-shrink: 0;
            background: #eff6ff;
            color: var(--pg-blue);
            border: 1px solid #dbeafe;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        /* Toolbar + search */
        .pg-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 0.85rem;
        }

        .pg-search {
            position: relative;
            flex: 1 1 180px;
            margin-bottom: 0;
        }

        .pg-search i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--pg-muted);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .pg-search input {
            width: 100%;
            border: 1px solid var(--pg-line);
            background: var(--pg-card);
            border-radius: 12px;
            padding: 0.7rem 0.9rem 0.7rem 2.4rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--pg-text);
            box-shadow: var(--pg-shadow);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            height: 44px;
        }

        .pg-search input:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .view-toggle {
            display: inline-flex;
            gap: 6px;
        }

        .view-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--card);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-2);
            font-size: 17px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #f8fafc;
        }

        .view-btn.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }

        .pg-section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.65rem;
        }

        .pg-section-label h2 {
            margin: 0;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--pg-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .pg-section-label small {
            font-size: 0.72rem;
            color: var(--pg-muted);
            font-weight: 600;
        }

        /* ===== Cards (from first page) ===== */
        .tests-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 576px) {
            .tests-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 992px) {
            .tests-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .tcard,
        .trow {
            --tone: var(--none);
            display: flex;
            text-decoration: none;
            color: inherit;
            background: var(--card);
            border: 1px solid var(--line);
            transition: border-color .15s;
            cursor: pointer;
            font-family: inherit;
        }

        .tcard:hover,
        .trow:hover {
            border-color: #94a3b8;
            color: inherit;
        }

        .tone-good {
            --tone: var(--good);
        }

        .tone-mid {
            --tone: var(--mid);
        }

        .tone-bad {
            --tone: var(--bad);
        }

        .tcard {
            flex-direction: column;
            border-radius: 14px;
            padding: 16px 16px 14px;
            min-height: 152px;
            width: 100%;
            text-align: left;
        }

        .tc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 20px;
            margin-bottom: 6px;
        }

        .tc-sub {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-3);
            line-height: 1.3;
        }

        .pct {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--tone);
            font-variant-numeric: tabular-nums;
        }

        .pct::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--tone);
        }

        .tc-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -.2px;
            margin-bottom: 6px;
        }

        .tc-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 2px 14px;
            font-size: 13px;
            color: var(--ink-2);
            font-weight: 500;
            margin-bottom: auto;
            padding-bottom: 14px;
        }

        .tc-meta b {
            color: var(--ink);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .strip {
            display: flex;
            gap: 3px;
            height: 4px;
        }

        .strip span {
            flex: 1 1 0;
            min-width: 3px;
            border-radius: 2px;
            background: var(--none);
            opacity: .5;
        }

        .strip span.s-good {
            background: var(--good);
            opacity: 1;
        }

        .strip span.s-mid {
            background: var(--mid);
            opacity: 1;
        }

        .strip span.s-bad {
            background: var(--bad);
            opacity: 1;
        }

        .strip.unknown span {
            opacity: .25;
        }

        .tc-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 9px;
            font-size: 12px;
            color: var(--ink-3);
            font-weight: 500;
            min-height: 18px;
        }

        .resume {
            font-weight: 700;
            color: #b45309;
        }

        /* ===== List view ===== */
        .tests-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trow {
            align-items: center;
            gap: 16px;
            border-radius: 12px;
            padding: 13px 16px;
            width: 100%;
            text-align: left;
        }

        .tr-body {
            flex: 1;
            min-width: 0;
        }

        .tr-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tr-sub {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-3);
            margin-bottom: 1px;
        }

        .trow .tc-meta {
            padding: 0;
            margin: 3px 0 0;
            font-size: 12px;
        }

        .tr-strip {
            width: 90px;
            flex-shrink: 0;
        }

        .trow .pct {
            min-width: 46px;
            justify-content: flex-end;
        }

        @media (max-width: 575px) {
            .tr-strip {
                display: none;
            }
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            background: var(--card);
            border-radius: 14px;
            border: 1px dashed var(--line);
            display: none;
        }

        .empty-state i {
            font-size: 38px;
            color: #cbd5e1;
        }

        .empty-state h3 {
            font-size: 17px;
            font-weight: 700;
            margin: 10px 0 6px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--ink-3);
            margin: 0;
        }

        @media (min-width: 768px) {
            .pg-page {
                padding: 1.5rem 1.25rem 3rem;
            }

            .pg-hero h1 {
                font-size: 1.55rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

    <script>
        const LS_RESULTS = "pulsego_test_results_v1";
        const LS_DATA = "pulsego_data_v1";
        const LS_UNSOLVED = "pulsego_unsolved_v1";
        const LS_PROGRESS = "pulsego_test_progress_v1";
        const GOOD_AT = 80, MID_AT = 56;

        let currentView = 'card'; // default = card style from your first page

        function openSidebar() {
            document.getElementById("sidebar")?.classList.add("open");
            document.getElementById("sidebarOverlay")?.classList.add("show");
            document.body.style.overflow = "hidden";
        }
        function closeSidebar() {
            document.getElementById("sidebar")?.classList.remove("open");
            document.getElementById("sidebarOverlay")?.classList.remove("show");
            document.body.style.overflow = "";
        }

        function bridgeTests() {
            const bank = window.TEST_QUESTIONS || {};
            window.tests = window.tests || {};
            Object.keys(bank).forEach((key) => {
                if (Array.isArray(bank[key])) {
                    window.tests[key] = bank[key];
                }
            });
        }

        const PAGE_CARDS = [
            { testName: "img2", title: "2-rasm" },
            { testName: "img3", title: "3-rasm" },
            { testName: "img4", title: "4-rasm" },
            { testName: "img5", title: "5-rasm" },
            { testName: "img6", title: "6-rasm" },
            { testName: "img7", title: "7-rasm" },
            { testName: "img8", title: "8-rasm" },
            { testName: "img9", title: "9-rasm" },
            { testName: "img10", title: "10-rasm" },
            { testName: "img12", title: "12-rasm" },
            { testName: "img13", title: "13-rasm" },
            { testName: "img14", title: "14-rasm" },
            { testName: "img15", title: "15-rasm" },
            { testName: "img16", title: "16-rasm" },
            { testName: "img17", title: "17-rasm" },
            { testName: "img18", title: "18-rasm" },
            { testName: "img19", title: "19-rasm" },
            { testName: "img21", title: "21-rasm" }
        ];

        function getPageCards() {
            bridgeTests();
            return PAGE_CARDS.filter((c) => Array.isArray(window.tests?.[c.testName]));
        }

        window.testTitleMap = window.testTitleMap || {};
        PAGE_CARDS.forEach((c) => {
            window.testTitleMap[c.testName] = c.title;
        });

        function readJSON(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                return JSON.parse(raw);
            } catch (e) {
                return fallback;
            }
        }

        function isPageTest(name) {
            if (!name) return false;
            const n = String(name).toLowerCase();
            return PAGE_CARDS.some(
                (c) => n === c.testName.toLowerCase() || n.includes(c.testName.toLowerCase())
            );
        }

        function normalizeEntry(e) {
            if (!e || typeof e !== "object") return null;
            const testName = String(e.testName || e.name || e.id || e.test || "unknown");
            const correct = Number(e.correct ?? e.correctAnswers ?? e.score ?? 0) || 0;
            const total = Number(e.total ?? e.totalQuestions ?? 0) || 0;
            let wrong = e.wrong != null ? Number(e.wrong) : null;
            if (wrong == null && e.mistakesCount != null) wrong = Number(e.mistakesCount) || 0;
            if (wrong == null && Array.isArray(e.mistakes)) wrong = e.mistakes.length;
            if (wrong == null && total >= correct) wrong = Math.max(0, total - correct);
            if (wrong == null) wrong = 0;
            let solved = e.solved != null ? Number(e.solved) : correct + wrong;
            if (!solved && total) solved = Math.min(total, correct + wrong);
            if (solved < correct) solved = correct;
            let percent = e.percent != null ? Number(e.percent) : null;
            if (percent == null) {
                percent =
                    solved > 0
                        ? Math.round((correct / solved) * 100)
                        : total > 0
                            ? Math.round((correct / total) * 100)
                            : 0;
            }
            return {
                testName,
                correct,
                wrong,
                solved,
                total,
                percent,
                date: e.date || e.createdAt || e.updatedAt || null,
                partial: !!e.partial,
                source: e._source || "unknown",
            };
        }

        function entryFromProgress(p) {
            if (!p || !isPageTest(p.testName || p.testNameRaw)) return null;
            const correct = Number(p.score) || 0;
            const wrong = Array.isArray(p.mistakes) ? p.mistakes.length : 0;
            return normalizeEntry({
                testName: p.testNameRaw || p.testName,
                correct,
                wrong,
                solved: correct + wrong,
                total: Number(p.total) || 0,
                partial: true,
                date: p.updatedAt,
                _source: "progress",
            });
        }

        function getAllResultEntries() {
            const out = [];
            const push = (item, source) => {
                if (!item) return;
                if (source) item = Object.assign({}, item, { _source: source });
                const n = normalizeEntry(item);
                if (n && isPageTest(n.testName)) out.push(n);
            };
            const pushList = (list, source) => {
                if (!Array.isArray(list)) return;
                list.forEach((x) => push(x, source));
            };

            try {
                if (typeof getUnifiedTestResults === "function") {
                    pushList(getUnifiedTestResults(), "unified");
                } else if (window.getUnifiedTestResults) {
                    pushList(window.getUnifiedTestResults(), "unified");
                }
            } catch (e) { }

            try {
                const obj = readJSON(LS_RESULTS, null);
                if (obj) {
                    if (Array.isArray(obj.tests)) pushList(obj.tests, "results_v1");
                    else if (Array.isArray(obj)) pushList(obj, "results_v1");
                }
            } catch (e) { }

            try {
                const data = readJSON(LS_DATA, {});
                pushList(data.results, "data.results");
                pushList(data.testResults, "data.testResults");
            } catch (e) { }

            try {
                const store = readJSON(LS_PROGRESS, {});
                if (store && typeof store === "object") {
                    if (store.testName) {
                        const n = entryFromProgress(store);
                        if (n) out.push(n);
                    } else {
                        Object.values(store).forEach((p) => {
                            const n = entryFromProgress(p);
                            if (n) out.push(n);
                        });
                    }
                }
            } catch (e) { }

            const seen = new Set();
            return out.filter((e) => {
                const k = `${e.testName}|${e.date}|${e.correct}|${e.solved}|${e.source}`;
                if (seen.has(k)) return false;
                seen.add(k);
                return true;
            });
        }

        function buildPageStats() {
            const cards = getPageCards();
            const pageIds = cards.map((c) => c.testName);
            const entries = getAllResultEntries();
            const byTest = {};
            let runs = 0,
                correctSum = 0,
                wrongSum = 0,
                solvedSum = 0;

            entries.forEach((e) => {
                let key = e.testName;
                const found = pageIds.find(
                    (id) =>
                        key.toLowerCase() === id.toLowerCase() ||
                        key.toLowerCase().includes(id.toLowerCase())
                );
                if (found) key = found;

                runs++;
                correctSum += e.correct;
                wrongSum += e.wrong;
                solvedSum += e.solved;

                if (!byTest[key]) {
                    byTest[key] = {
                        attempts: 0,
                        totalCorrect: 0,
                        totalWrong: 0,
                        totalSolved: 0,
                        totalQuestions: 0,
                        last: null,
                    };
                }
                const t = byTest[key];
                t.attempts++;
                t.totalCorrect += e.correct;
                t.totalWrong += e.wrong;
                t.totalSolved += e.solved;
                t.totalQuestions += e.total;
                if (
                    !t.last ||
                    (e.date && t.last.date && new Date(e.date) > new Date(t.last.date)) ||
                    !t.last.date
                ) {
                    t.last = Object.assign({}, e, { testName: key });
                }
            });

            const takenTests = pageIds.filter((id) => byTest[id]?.last).length;
            const accuracy =
                solvedSum > 0 ? Math.round((correctSum / solvedSum) * 100) : 0;

            let catalogQuestions = 0;
            cards.forEach((c) => {
                const t = window.tests?.[c.testName];
                if (Array.isArray(t)) catalogQuestions += t.length;
            });

            let weakest = null;
            Object.keys(byTest).forEach((name) => {
                const last = byTest[name].last;
                if (!last) return;
                if (!weakest || (last.percent ?? 0) < (weakest.percent ?? 0)) {
                    weakest = { testName: name, percent: last.percent ?? 0 };
                }
            });

            const nextTodo = cards.find((c) => !byTest[c.testName]?.last) || null;

            return {
                cards,
                pageIds,
                catalogQuestions,
                takenTests,
                totalCards: cards.length,
                runs,
                correctSum,
                wrongSum,
                solvedSum,
                accuracy,
                byTest,
                weakest,
                nextTodo,
            };
        }

        function qCount(name) {
            const t = window.tests?.[name] || window.TEST_QUESTIONS?.[name];
            return Array.isArray(t) ? t.length : null;
        }

        function toneOf(p) {
            if (p == null) return null;
            return p >= GOOD_AT ? 'good' : p >= MID_AT ? 'mid' : 'bad';
        }

        const fmtDate = d => {
            try {
                return new Date(d).toLocaleDateString('uz-UZ', { day: '2-digit', month: 'short' });
            } catch (e) {
                return '';
            }
        };

        function startTestSafe(name) {
            if (!name) return;
            if (typeof window.startTest === "function") {
                bridgeTests();
                window.startTest(name);
                return;
            }
            console.log("Waiting for startTest…", name);
            let tries = 0;
            const t = setInterval(() => {
                tries++;
                if (typeof window.startTest === "function") {
                    clearInterval(t);
                    bridgeTests();
                    window.startTest(name);
                    return;
                }
                if (tries > 50) {
                    clearInterval(t);
                    console.error("startTest still not ready. Check testcases.js load/errors.");
                    alert("Test engine yuklanmadi. Sahifani yangilang (refresh).");
                }
            }, 100);
        }

        function stripHtml(pct) {
            if (pct == null) {
                return `<div class="strip unknown"><span></span><span></span><span></span></div>`;
            }
            const tone = toneOf(pct);
            return `<div class="strip"><span class="s-${tone}"></span></div>`;
        }

        function renderCards() {
            const container = document.getElementById("anatomy-test-cards");
            const empty = document.getElementById("listEmpty");
            if (!container) return;

            const s = buildPageStats();
            const cards = s.cards;
            const query = (document.getElementById("testSearch")?.value || "").trim().toLowerCase();

            const filtered = cards.filter((c) => {
                if (!query) return true;
                return c.title.toLowerCase().includes(query) || c.testName.toLowerCase().includes(query);
            });

            if (!filtered.length) {
                container.innerHTML = "";
                container.style.display = "none";
                empty.style.display = "block";
                document.getElementById("listCount").textContent = "0 ta";
                return;
            }

            empty.style.display = "none";
            container.style.display = "";

            document.getElementById("listCount").textContent = `${filtered.length} ta`;

            if (currentView === "card") {
                container.className = "tests-grid";
                container.innerHTML = filtered.map((c) => {
                    const st = s.byTest[c.testName];
                    const n = qCount(c.testName);
                    const last = st?.last;
                    let pct = null;
                    if (last) {
                        pct = st.totalSolved
                            ? Math.round((st.totalCorrect / st.totalSolved) * 100)
                            : (last.percent || 0);
                    }
                    const toneClass = pct != null ? "tone-" + toneOf(pct) : "";
                    const pctHtml = pct != null
                        ? `<span class="pct">${pct}%</span>`
                        : "";

                    const metaParts = [];
                    if (n != null) metaParts.push(`<span><b>${n}</b> ta savol</span>`);
                    if (!last) metaParts.push(`<span>Hali ishlanmagan</span>`);

                    const leftFoot = last
                        ? `${last.correct}/${last.solved || last.total}`
                        : "";
                    const rightFoot = last && last.date
                        ? `Oxirgi: ${pct}% (${fmtDate(last.date)})`
                        : (last ? "" : "Boshlash");

                    return `
                    <button type="button" class="tcard ${toneClass}"
                        data-test-name="${c.testName}"
                        data-title="${String(c.title).replace(/"/g, "&quot;")}">
                        <div class="tc-top">
                            <span class="tc-sub">Anatomy · YN</span>
                            ${pctHtml}
                        </div>
                        <div class="tc-title">${c.title}</div>
                        <div class="tc-meta">${metaParts.join("")}</div>
                        ${stripHtml(pct)}
                        <div class="tc-foot">
                            <span>${leftFoot}</span>
                            <span>${rightFoot}</span>
                        </div>
                    </button>`;
                }).join("");
            } else {
                container.className = "tests-list";
                container.innerHTML = filtered.map((c) => {
                    const st = s.byTest[c.testName];
                    const n = qCount(c.testName);
                    const last = st?.last;
                    let pct = null;
                    if (last) {
                        pct = st.totalSolved
                            ? Math.round((st.totalCorrect / st.totalSolved) * 100)
                            : (last.percent || 0);
                    }
                    const toneClass = pct != null ? "tone-" + toneOf(pct) : "";
                    const pctHtml = pct != null
                        ? `<span class="pct">${pct}%</span>`
                        : `<span class="pct" style="color:var(--ink-3)">—</span>`;

                    const metaParts = [];
                    if (n != null) metaParts.push(`<span><b>${n}</b> ta savol</span>`);
                    if (!last) metaParts.push(`<span>Hali ishlanmagan</span>`);

                    return `
                    <button type="button" class="trow ${toneClass}"
                        data-test-name="${c.testName}"
                        data-title="${String(c.title).replace(/"/g, "&quot;")}">
                        <div class="tr-body">
                            <div class="tr-sub">Anatomy · YN</div>
                            <div class="tr-title">${c.title}</div>
                            <div class="tc-meta">${metaParts.join("")}</div>
                        </div>
                        <div class="tr-strip">${stripHtml(pct)}</div>
                        ${pctHtml}
                        <i class="bi bi-chevron-right" style="color:var(--ink-3)"></i>
                    </button>`;
                }).join("");
            }

            container.querySelectorAll("[data-test-name]").forEach((btn) => {
                btn.onclick = () => startTestSafe(btn.dataset.testName);
            });
        }

        function setView(v) {
            currentView = v;
            document.getElementById("btnCardView").classList.toggle("active", v === "card");
            document.getElementById("btnListView").classList.toggle("active", v === "list");
            try {
                localStorage.setItem("pulsego_yn2026_view", v);
            } catch (e) { }
            renderCards();
        }

        function refreshPageData() {
            renderCards();
        }

        document.addEventListener("DOMContentLoaded", () => {
            try {
                const saved = localStorage.getItem("pulsego_yn2026_view");
                if (saved === "card" || saved === "list") currentView = saved;
            } catch (e) { }

            document.getElementById("btnCardView")?.addEventListener("click", () => setView("card"));
            document.getElementById("btnListView")?.addEventListener("click", () => setView("list"));

            // apply initial active state
            document.getElementById("btnCardView")?.classList.toggle("active", currentView === "card");
            document.getElementById("btnListView")?.classList.toggle("active", currentView === "list");

            refreshPageData();
            setTimeout(refreshPageData, 400);
            setTimeout(refreshPageData, 1200);

            document.getElementById("testSearch")?.addEventListener("input", () => {
                renderCards();
            });
        });

        window.addEventListener("focus", refreshPageData);
        window.addEventListener("pulse:result-saved", refreshPageData);
        window.addEventListener("pageshow", refreshPageData);
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") refreshPageData();
        });

        window.__pulsePageStats = function () {
            console.log("TEST_QUESTIONS keys:", Object.keys(window.TEST_QUESTIONS || {}));
            console.log("window.tests keys:", Object.keys(window.tests || {}));
            console.table(getAllResultEntries());
            return buildPageStats();
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
