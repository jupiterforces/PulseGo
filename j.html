<!DOCTYPE html>
<html>

<head>
    <title>PulseGo Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
        }

        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .user-card {
            display: flex;
            justify-content: space-between;
            padding: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.2s;
        }

        .user-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.01);
        }

        .main-value {
            font-size: 20px;
            font-weight: bold;
        }

        .muted-small {
            font-size: 12px;
            color: #94a3b8;
        }

        .rank-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 8px;
        }

        .top1 {
            background: gold;
            color: black;
        }

        .top2 {
            background: silver;
            color: black;
        }

        .top3 {
            background: #cd7f32;
            color: black;
        }

        input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: none !important;
            color: white !important;
        }

        input::placeholder {
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="gate" class="container mt-5">
        <div class="glass p-4">
            <h4>Enter Access Code</h4>

            <input id="codeInput" class="form-control mb-3" placeholder="Enter code...">

            <button class="btn btn-primary w-100" onclick="checkCode()">Unlock</button>

            <div id="err" class="text-danger mt-2 d-none">Wrong code!</div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="container mt-4 d-none">

        <h3>📊 PulseGo Pro Analytics</h3>

        <div class="mb-2">
            <div class="btn-group" role="group" aria-label="views">
                <button id="viewUsersBtn" type="button" class="btn btn-sm btn-primary"
                    onclick="setView('users')">Foydalanuvchilar</button>
                <button id="viewFeedbackBtn" type="button" class="btn btn-sm btn-outline-light"
                    onclick="setView('feedbacks')">Fikr-mulohazalar</button>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="glass p-3 mb-3">

            <input id="search" class="form-control mb-2" placeholder="Search users..." oninput="render()">

            <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-primary" onclick="setMode('percent')">Percent</button>
                <button class="btn btn-sm btn-outline-light" onclick="setMode('totalCorrect')">Correct</button>
                <button class="btn btn-sm btn-outline-light" onclick="setMode('totalQuestions')">Questions</button>
                <button class="btn btn-sm btn-outline-light" onclick="setMode('totalTests')">Tests</button>
            </div>

        </div>

        <!-- LIST -->
        <div id="usersPanel" class="glass p-3">
            <div id="list"></div>
        </div>

        <!-- FEEDBACKS -->
        <div id="feedbackPanel" class="glass p-3 mt-3 d-none">
            <h5>Fikr-mulohazalar (oxirgi yuborilganlar birinchi)</h5>
            <div id="feedbackList"></div>
        </div>

    </div>

    <script type="module">

        import { db } from "./firebase.js";
        import { collection, getDocs, collectionGroup }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        let USERS = [];
        let FEEDBACKS = [];
        let MODE = "percent";

        // ----------------------
        window.checkCode = async function () {

            const code = document.getElementById("codeInput").value;

            if (code !== "gironic") {
                document.getElementById("err").classList.remove("d-none");
                return;
            }

            document.getElementById("gate").classList.add("d-none");
            document.getElementById("dashboard").classList.remove("d-none");

            await loadUsers();
        };

        // ----------------------
        async function loadUsers() {

            const snap = await getDocs(collection(db, "users"));

            USERS = [];

            snap.forEach(doc => {
                const u = doc.data();
                const o = u.overview || {};

                USERS.push({
                    uid: doc.id,
                    name: u.name,
                    about: u.about || "",
                    percent: o.percent || 0,
                    totalCorrect: o.totalCorrect || 0,
                    totalQuestions: o.totalQuestions || 0,
                    totalTests: o.totalTests || 0
                });
            });

            render();
            await loadFeedbacks();
        }

        // load both top-level anonymous feedbacks and per-user feedback subcollections
        async function loadFeedbacks() {
            FEEDBACKS = [];

            // top-level anonymous/general feedbacks
            try {
                console.log('Loading top-level feedbacks...');
                const top = await getDocs(collection(db, "feedbacks"));
                top.forEach(d => {
                    const f = d.data();
                    FEEDBACKS.push({
                        id: d.id,
                        user: f.user || { name: f.name || 'Anonim' },
                        liked: f.liked,
                        advantages: f.advantages || '',
                        disadvantages: f.disadvantages || '',
                        createdAt: f.createdAt || null
                    });
                });
                console.log('Top-level feedbacks loaded:', FEEDBACKS.length);
            } catch (e) {
                console.warn('No top-level feedbacks or failed to load', e);
            }

            // fetch all subcollection 'feedbacks' across the DB using collectionGroup
            try {
                console.log('Loading collectionGroup feedbacks...');
                const cg = await getDocs(collectionGroup(db, 'feedbacks'));
                const userMap = Object.fromEntries(USERS.map(u => [u.uid, u.name]));
                let cgCount = 0;
                cg.forEach(d => {
                    const f = d.data();
                    // attempt to find parent user id from ref path (users/{uid}/feedbacks/{doc})
                    let uid = null;
                    try {
                        uid = d.ref.parent && d.ref.parent.parent ? d.ref.parent.parent.id : null;
                    } catch (e) {
                        uid = null;
                    }
                    const name = f.user?.name || (uid ? userMap[uid] : null) || 'Anonim';
                    FEEDBACKS.push({
                        id: d.id,
                        user: { name, uid },
                        liked: f.liked,
                        advantages: f.advantages || '',
                        disadvantages: f.disadvantages || '',
                        createdAt: f.createdAt || null
                    });
                    cgCount++;
                });
                console.log('CollectionGroup feedbacks loaded:', cgCount);
            } catch (e) {
                console.warn('Failed to load collectionGroup feedbacks', e);
            }

            // sort newest-first by createdAt (fallback to id numeric)
            FEEDBACKS.sort((a, b) => {
                const ta = a.createdAt ? new Date(a.createdAt).getTime() : Number(a.id) || 0;
                const tb = b.createdAt ? new Date(b.createdAt).getTime() : Number(b.id) || 0;
                return tb - ta;
            });

            renderFeedbacks();
        }

        // ----------------------
        window.setMode = function (mode) {
            MODE = mode;
            render();
        };

        // toggle between users view and feedbacks view
        window.setView = async function (view) {
            const usersPanel = document.getElementById('usersPanel');
            const feedbackPanel = document.getElementById('feedbackPanel');
            const usersBtn = document.getElementById('viewUsersBtn');
            const fbBtn = document.getElementById('viewFeedbackBtn');

            // hide/show panels explicitly
            usersPanel.classList.toggle('d-none', view !== 'users');
            feedbackPanel.classList.toggle('d-none', view !== 'feedbacks');

            // ensure underlying list is emptied when showing feedbacks to avoid visual overlap
            if (view === 'feedbacks') {
                try { document.getElementById('list').innerHTML = ''; } catch (e) { }
                usersBtn.classList.remove('btn-primary');
                usersBtn.classList.add('btn-outline-light');
                fbBtn.classList.remove('btn-outline-light');
                fbBtn.classList.add('btn-primary');
                await loadFeedbacks();
                renderFeedbacks();
            } else {
                // restore users view
                fbBtn.classList.remove('btn-primary');
                fbBtn.classList.add('btn-outline-light');
                usersBtn.classList.remove('btn-outline-light');
                usersBtn.classList.add('btn-primary');
                render();
            }
        };

        // ----------------------
        window.render = function () {

            let search = document.getElementById("search")?.value?.toLowerCase() || "";

            let list = USERS.filter(u =>
                u.name.toLowerCase().includes(search)
            );

            list.sort((a, b) => b[MODE] - a[MODE]);

            let html = "";
            let rank = 1;

            list.forEach((u, i) => {

                let badge = "";
                if (i === 0) badge = "top1";
                else if (i === 1) badge = "top2";
                else if (i === 2) badge = "top3";

                html += `
        <div class="user-card">

            <div>
                <span class="rank-badge ${badge}">#${rank++}</span>
                <b>${u.name}</b><br>
                <div class="muted-small">${u.about}</div>
            </div>

            <div class="text-end">
                <div class="main-value">${u[MODE]}</div>

                <div class="muted-small">
                    % ${u.percent} | Q ${u.totalQuestions} | C ${u.totalCorrect} | T ${u.totalTests}
                </div>
            </div>

        </div>`;
            });

            document.getElementById("list").innerHTML = html;
        };

        function renderFeedbacks() {
            const el = document.getElementById('feedbackList');
            if (!el) return;

            if (!FEEDBACKS || !FEEDBACKS.length) {
                el.innerHTML = '<div class="muted-small">Hozircha fikr-mulohaza yo\'q</div>';
                return;
            }

            let h = '';
            FEEDBACKS.forEach(f => {
                const when = f.createdAt ? new Date(f.createdAt).toLocaleString() : '';
                const name = escapeHtml(f.user?.name || 'Anonim');
                const liked = escapeHtml(String(f.liked || ''));
                const adv = f.advantages ? `<div><strong>Afzalliklar:</strong> ${escapeHtml(f.advantages)}</div>` : '';
                const dis = f.disadvantages ? `<div><strong>Kamchiliklar:</strong> ${escapeHtml(f.disadvantages)}</div>` : '';

                h += '<div class="user-card">';
                h += '<div><b>' + name + '</b>';
                h += '<div class="muted-small">' + when + '</div></div>';
                h += '<div style="text-align:left;max-width:65%;">';
                h += '<div><strong>Xulosa:</strong> ' + liked + '</div>';
                h += adv + dis;
                h += '</div></div>';
            });

            el.innerHTML = h;
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

    </script>

</body>

</html>
