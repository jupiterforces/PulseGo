<!doctype html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preparation — Tests</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Project styles -->
    <link rel="stylesheet" href="/assets/styles/styles.css">

    <style>
        :root {
            --bg: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #0d6efd;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 85px;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid #e9eef5;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.03);
        }

        .page-header {
            padding: 24px 0 14px;
        }

        .page-header .title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .page-header .meta {
            font-size: 14px;
            color: var(--muted);
        }

        .badge-progress {
            background: linear-gradient(90deg, var(--primary), #00c6ff);
            color: #fff;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }

        /* MAIN STATS */
        .main-stat-card {
            background: #fff;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
            text-align: center;
            height: 100%;
        }

        .main-stat-card.accuracy {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
        }

        .main-stat-card.completion {
            background: linear-gradient(135deg, #ecfdf5, #bbf7d0);
        }

        .main-stat-card .stat-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .main-stat-card .stat-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
        }

        .main-stat-card.accuracy .stat-value {
            color: #1d4ed8;
        }

        .main-stat-card.completion .stat-value {
            color: #166534;
        }

        /* PROJECT TEST CARD */
        .test-card {
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            border-radius: var(--tg-radius);
            padding: 18px 12px 42px;
            text-align: center;
            cursor: pointer;
            height: 100%;
            transition: all .35s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            position: relative;
            border: 1px solid transparent;
            text-decoration: none;
            display: block;
            color: var(--tg-text);
        }

        .test-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(0, 136, 204, .15), transparent);
            opacity: 0;
            transition: .3s;
            pointer-events: none;
        }

        .test-card:hover::after {
            opacity: 1;
        }

        .test-card:hover {
            transform: translateY(-6px) scale(1.02);
        }

        .test-card .test-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 22px;
        }

        .test-card .test-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .test-card .test-meta {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .test-card .question-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 6px 10px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.3px;
            border-radius: 0 0 14px 14px;
            transform: translateX(-100%);
            animation: slideInLeft 0.6s ease-out forwards;
            animation-delay: 0.2s;
        }

        .test-card .question-footer.footer-default {
            background: #0d6efd;
        }

        .test-card .question-footer.footer-success {
            background: #22c55e;
        }

        .test-card .question-footer.footer-warning {
            background: #f59e0b;
        }

        .test-card .question-footer.footer-danger {
            background: #ef4444;
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .test-card .mini-stats {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 11px;
            color: var(--tg-muted);
            margin-bottom: 8px;
        }

        .test-card .mini-stats span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .test-card .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            z-index: 2;
        }

        .test-card .status-badge.status-new {
            background: #94a3b8;
        }

        .test-card .status-badge.status-done {
            background: #22c55e;
        }

        .test-card .status-badge.status-mid {
            background: #f59e0b;
        }

        .test-card .status-badge.status-bad {
            background: #ef4444;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
        }

        .empty-state i {
            font-size: 48px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(18px);
            border-top: 1px solid #e5eaf1;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1050;
        }

        .bottom-nav .nav-item {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
            transition: .2s ease;
        }

        .bottom-nav .nav-item i {
            display: block;
            font-size: 21px;
            margin-bottom: 2px;
        }

        .bottom-nav .nav-item.active {
            color: #0d6efd;
        }

        @media(max-width:768px) {
            .page-header .title {
                font-size: 20px;
            }

            .main-stat-card .stat-value {
                font-size: 22px;
            }
        }
    </style>
</head>

<body data-page="prep-tests">

    <!-- NAVBAR -->
    <nav class="navbar sticky-top">
        <div class="container d-flex align-items-center gap-3 py-2">
            <a href="#" id="backBtn" class="btn btn-light btn-sm rounded-pill">
                <i class="bi bi-arrow-left"></i> Orqaga
            </a>
            <div class="ms-2">
                <div id="prep-tests-title" class="title">Mavzu</div>
                <div id="prep-tests-meta" class="meta">0 test · 0 savol</div>
            </div>
            <div class="ms-auto">
                <span id="sessionBadge" class="badge-progress">Progress 0%</span>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- PAGE HEADER -->
        <section class="page-header">
            <div class="d-flex justify-content-between align-items-start flex-column flex-md-row gap-3">
                <div>
                    <div class="title" id="prep-tests-header-title">Mavzu testlari</div>
                    <div class="meta" id="prep-tests-header-meta">Tanlangan mavzuning barcha testlari</div>
                </div>
            </div>
        </section>

        <!-- MAIN STATS -->
        <section class="mb-3">
            <div class="row g-3" id="prep-tests-stats"></div>
        </section>

        <!-- TESTS -->
        <section>
            <div id="prep-tests-container">
                <div class="row g-3" id="prep-tests-grid"></div>
            </div>
        </section>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav d-lg-none">
        <a href="/" class="nav-item">
            <i class="bi bi-house-fill"></i>
            <span>Asosiy</span>
        </a>
        <a href="/tests" class="nav-item">
            <i class="bi bi-ui-checks-grid"></i>
            <span>Testlar</span>
        </a>
        <a href="/preparation" class="nav-item active">
            <i class="bi bi-journal-bookmark-fill"></i>
            <span>Tayyorgarlik</span>
        </a>
        <a href="/profile" class="nav-item">
            <i class="bi bi-person"></i>
            <span>Profil</span>
        </a>
    </nav>

    <script src="/assets/js/data.js"></script>
    <script src="prep-data.js"></script>
    <script src="./preparation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('backBtn').addEventListener('click', (e) => { e.preventDefault(); history.back(); });
    </script>
</body>

</html>
