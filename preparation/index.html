<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tayyorlanish – Pulse Go</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles/styles.css">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--tg-bg);
            color: var(--tg-text);
            padding-bottom: 90px;
        }

        /* ── NAVBAR ─────────────────────────────── */
        .navbar {
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #e9eef5;
            box-shadow: 0 4px 14px rgba(15, 23, 42, .04);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 17px;
            color: var(--tg-text) !important;
        }

        .navbar-brand img {
            box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
        }

        /* ── PAGE HEADER ───────────────────────── */
        .page-header {
            padding: 28px 0 18px;
        }

        .page-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--tg-text);
            letter-spacing: -.5px;
        }

        .page-header p {
            color: var(--tg-muted);
            font-size: 14px;
            margin-bottom: 0;
        }

        /* ── ADD SESSION BTN ───────────────────── */
        .btn-add-session {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(37, 99, 235, .35);
            transition: .25s ease;
        }

        .btn-add-session:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(37, 99, 235, .45);
            color: #fff;
        }

        /* ── EMPTY STATE ───────────────────────── */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #2563eb;
            margin: 0 auto 20px;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--tg-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* ── SESSION CARD ──────────────────────── */
        .session-card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 6px 24px rgba(15, 23, 42, .07);
            overflow: hidden;
            cursor: pointer;
            transition: all .28s ease;
            position: relative;
        }

        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 40px rgba(15, 23, 42, .12);
        }

        .sc-header {
            padding: 18px 18px 14px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .sc-type-icon {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            flex-shrink: 0;
        }

        .sc-info {
            flex: 1;
            min-width: 0;
        }

        .sc-exam-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--tg-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sc-date {
            font-size: 12px;
            color: var(--tg-muted);
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sc-percent-badge {
            flex-shrink: 0;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-size: 14px;
            font-weight: 800;
            border: 3px solid #e2e8f0;
        }

        .sc-percent-badge.good {
            border-color: #22c55e;
            color: #16a34a;
        }

        .sc-percent-badge.mid {
            border-color: #f59e0b;
            color: #d97706;
        }

        .sc-percent-badge.low {
            border-color: #ef4444;
            color: #dc2626;
        }

        .sc-percent-badge.zero {
            border-color: #cbd5e1;
            color: #94a3b8;
        }

        .sc-progress-wrap {
            padding: 0 18px 8px;
        }

        .sc-progress-track {
            height: 6px;
            background: #f1f5f9;
            border-radius: 999px;
            overflow: hidden;
        }

        .sc-progress-fill {
            height: 100%;
            border-radius: 999px;
            transition: width .6s ease;
        }

        .sc-footer {
            padding: 10px 18px 16px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .sc-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-muted);
        }

        .sc-stat i {
            font-size: 13px;
        }

        .sc-countdown {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #f1f5f9;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--tg-text);
        }

        .sc-countdown.urgent {
            background: #fef2f2;
            color: #dc2626;
        }

        .sc-countdown.soon {
            background: #fffbeb;
            color: #d97706;
        }

        .sc-countdown.ok {
            background: #f0fdf4;
            color: #16a34a;
        }

        .sc-countdown.past {
            background: #f8fafc;
            color: #94a3b8;
        }

        /* card color accent strips */
        .session-card.accent-danger {
            border-top: 3px solid #dc2626;
        }

        .session-card.accent-warning {
            border-top: 3px solid #d97706;
        }

        .session-card.accent-success {
            border-top: 3px solid #16a34a;
        }

        .session-card.accent-primary {
            border-top: 3px solid #2563eb;
        }

        /* ── WIZARD MODAL ──────────────────────── */
        .wizard-modal .modal-content {
            border: none;
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(15, 23, 42, .18);
        }

        .wizard-header {
            padding: 24px 24px 0;
            border-bottom: none;
        }

        .wizard-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--tg-text);
        }

        .wizard-step-dots {
            display: flex;
            gap: 6px;
            margin-top: 14px;
            margin-bottom: 2px;
        }

        .wsd {
            height: 4px;
            border-radius: 999px;
            background: #e2e8f0;
            flex: 1;
            transition: background .3s;
        }

        .wsd.active {
            background: #2563eb;
        }

        .wsd.done {
            background: #22c55e;
        }

        .wizard-body {
            padding: 20px 24px 24px;
        }

        /* Step 1 – exam type cards */
        .exam-type-card {
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 20px 16px;
            cursor: pointer;
            transition: all .22s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fff;
        }

        .exam-type-card:hover {
            border-color: #2563eb;
            background: #eff6ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, .12);
        }

        .exam-type-card.selected {
            border-color: #2563eb;
            background: #eff6ff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
        }

        .etc-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            flex-shrink: 0;
        }

        .etc-label {
            font-size: 16px;
            font-weight: 700;
            color: var(--tg-text);
        }

        .etc-desc {
            font-size: 12px;
            color: var(--tg-muted);
            margin-top: 2px;
        }

        /* Step 2 – subject rows */
        .subject-row {
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 10px;
            transition: border-color .2s;
        }

        .subject-row.has-selected {
            border-color: #2563eb;
        }

        .subject-row-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            background: #fff;
            user-select: none;
        }

        .subject-row-header:hover {
            background: #f8fafc;
        }

        .sr-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #fff;
            flex-shrink: 0;
        }

        .sr-label {
            flex: 1;
            font-size: 14px;
            font-weight: 700;
            color: var(--tg-text);
        }

        .sr-count {
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-muted);
            background: #f1f5f9;
            border-radius: 999px;
            padding: 3px 10px;
        }

        .sr-chevron {
            font-size: 16px;
            color: var(--tg-muted);
            transition: transform .25s;
        }

        .subject-row.open .sr-chevron {
            transform: rotate(180deg);
        }

        .subject-row-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .3s ease;
            background: #f8fafc;
            padding: 0 16px;
        }

        .subject-row.open .subject-row-body {
            max-height: 800px;
            padding: 10px 16px 14px;
        }

        .test-check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background .2s;
        }

        .test-check-item:hover {
            background: #eff6ff;
        }

        .test-check-item input[type=checkbox] {
            width: 17px;
            height: 17px;
            accent-color: #2563eb;
            flex-shrink: 0;
            cursor: pointer;
        }

        .tci-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--tg-text);
            flex: 1;
        }

        .tci-count {
            font-size: 11px;
            color: var(--tg-muted);
        }

        .select-all-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px 10px;
            font-size: 12px;
            font-weight: 700;
            color: #2563eb;
            cursor: pointer;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 6px;
        }

        .select-all-row input[type=checkbox] {
            width: 15px;
            height: 15px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        /* Step 3 – date */
        .date-input-wrap {
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 18px;
            background: #fff;
            transition: border-color .2s;
        }

        .date-input-wrap:focus-within {
            border-color: #2563eb;
        }

        .date-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--tg-muted);
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-bottom: 8px;
        }

        .date-input-wrap input[type=date] {
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: var(--tg-text);
            background: transparent;
            width: 100%;
        }

        /* wizard footer */
        .wizard-footer {
            padding: 16px 24px 22px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-wiz-back {
            background: #f1f5f9;
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-text);
            transition: .2s;
        }

        .btn-wiz-back:hover {
            background: #e2e8f0;
        }

        .btn-wiz-next {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 14px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 6px 18px rgba(37, 99, 235, .3);
            transition: .2s;
        }

        .btn-wiz-next:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(37, 99, 235, .4);
            color: #fff;
        }

        .btn-wiz-next:disabled {
            opacity: .5;
            pointer-events: none;
        }

        /* ── BOTTOM NAV ────────────────────────── */
        @media(max-width:768px) {
            .page-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="/assets/img/PulseGo.jpg" width="40" height="40" class="rounded-circle">
                Pulse Go
            </a>
            <a href="/" class="btn btn-light btn-sm rounded-pill">
                <i class="bi bi-house"></i> Home
            </a>
        </div>
    </nav>

    <!-- PAGE HEADER -->
    <section class="page-header">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
                <div>
                    <h1>Tayyorlanish</h1>
                    <p>Imtihon sessiyalari va progress</p>
                </div>
                <button class="btn-add-session" onclick="openWizard()">
                    <i class="bi bi-plus-lg"></i>
                    Sessiya qo'shish
                </button>
            </div>
        </div>
    </section>

    <!-- SESSIONS GRID -->
    <section class="pb-3">
        <div class="container">
            <div id="sessions-container">
                <!-- Rendered by JS -->
            </div>
        </div>
    </section>

    <!-- ══════════════════════════════════════════
       ADD SESSION WIZARD MODAL
  ══════════════════════════════════════════ -->
    <div class="modal fade wizard-modal" id="wizardModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">

                <div class="wizard-header">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="wizard-title" id="wizardTitle">Yangi sessiya</div>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="wizard-step-dots mt-3">
                        <div class="wsd active" id="dot1"></div>
                        <div class="wsd" id="dot2"></div>
                        <div class="wsd" id="dot3"></div>
                    </div>
                    <div class="mt-2 mb-1" style="font-size:12px;color:var(--tg-muted)" id="wizardStepLabel">
                        1/3 – Imtihon turini tanlang
                    </div>
                </div>

                <div class="wizard-body" id="wizardBody">
                    <!-- Steps rendered by JS -->
                </div>

                <div class="wizard-footer">
                    <button class="btn-wiz-back d-none" id="wizBtnBack" onclick="wizBack()">
                        <i class="bi bi-arrow-left me-1"></i> Orqaga
                    </button>
                    <button class="btn-wiz-next" id="wizBtnNext" onclick="wizNext()">
                        Davom etish <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav d-lg-none">
        <a href="/" class="bn-item">
            <i class="bi bi-house-fill"></i>
            <span>Asosiy</span>
        </a>
        <a href="/tests/" class="bn-item">
            <i class="bi bi-grid-3x3-gap-fill"></i>
            <span>QBank</span>
        </a>
        <a href="/preparation/" class="bn-item active">
            <span class="bn-fab-btn"><i class="bi bi-journals"></i></span>
            <span>Tayyorlanish</span>
        </a>
        <a href="/lessons" class="bn-item">
            <i class="bi bi-book-half"></i>
            <span>Darslar</span>
        </a>
        <a href="/profile" class="bn-item">
            <i class="bi bi-person-fill"></i>
            <span>Profil</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/preparation/prep-data.js"></script>
    <script src="/preparation/oraliq-data.js"></script>

    <script>
        // ══════════════════════════════════════════════════════
        //  DATA HELPERS  (relies on test.js infrastructure via
        //  localStorage – same keys as test.js uses)
        // ══════════════════════════════════════════════════════

        function getStoredSessions() {
            try {
                const raw = localStorage.getItem('pulsego_data_v1');
                const data = raw ? JSON.parse(raw) : {};
                return Array.isArray(data.preparationSessions) ? data.preparationSessions : [];
            } catch (e) { return []; }
        }

        function saveStoredSessions(sessions) {
            try {
                const raw = localStorage.getItem('pulsego_data_v1');
                const data = raw ? JSON.parse(raw) : {};
                data.preparationSessions = sessions;
                localStorage.setItem('pulsego_data_v1', JSON.stringify(data));
            } catch (e) { }
        }

        function createSession(session) {
            const sessions = getStoredSessions();
            sessions.unshift(session);
            saveStoredSessions(sessions);
        }

        // ══════════════════════════════════════════════════════
        //  RENDER SESSIONS
        // ══════════════════════════════════════════════════════

        function daysUntil(dateStr) {
            if (!dateStr) return null;
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const exam = new Date(dateStr); exam.setHours(0, 0, 0, 0);
            return Math.round((exam - today) / 86400000);
        }

        function countdownClass(days) {
            if (days === null) return 'zero';
            if (days < 0) return 'past';
            if (days <= 3) return 'urgent';
            if (days <= 7) return 'soon';
            return 'ok';
        }

        function countdownLabel(days) {
            if (days === null) return '';
            if (days < 0) return 'Tugagan';
            if (days === 0) return 'Bugun!';
            if (days === 1) return '1 kun qoldi';
            return `${days} kun qoldi`;
        }

        function percentClass(pct) {
            if (pct === 0) return 'zero';
            if (pct >= 80) return 'good';
            if (pct >= 56) return 'mid';
            return 'low';
        }

        function progressColor(pct) {
            if (pct >= 80) return '#22c55e';
            if (pct >= 56) return '#f59e0b';
            if (pct > 0) return '#ef4444';
            return '#cbd5e1';
        }

        function accentClass(examTypeId) {
            const et = getExamType(examTypeId);
            if (!et) return '';
            return 'accent-' + et.color;
        }

        function totalQuestionsInSession(session) {
            if (!session.tests || !session.subjects) return 0;
            let total = 0;
            session.subjects.forEach(subId => {
                const sub = getSubject(subId);
                if (!sub) return;
                const selectedTests = (session.tests[subId] || []);
                selectedTests.forEach(key => {
                    const tc = sub.tests.find(t => t.key === key);
                    if (tc) total += (tc.count === 'all' ? 20 : tc.count);
                });
            });
            return total;
        }

        function renderSessions() {
            const container = document.getElementById('sessions-container');
            const sessions = getStoredSessions();

            if (!sessions.length) {
                container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="bi bi-journals"></i></div>
            <h3>Sessiya yo'q</h3>
            <p>Imtihonga tayyorlanish uchun sessiya yarating va o'z progressingizni kuzating.</p>
            <button class="btn-add-session mx-auto" onclick="openWizard()" style="justify-content:center">
              <i class="bi bi-plus-lg"></i>
              Birinchi sessiyani yarating
            </button>
          </div>
        `;
                return;
            }

            const html = sessions.map(s => {
                const et = getExamType(s.examType);
                const stats = s.stats || { accuracy: 0, solvedQuestions: 0, correctAnswers: 0 };
                const pct = stats.accuracy || 0;
                const days = daysUntil(s.examDate);
                const cdClass = countdownClass(days);
                const cdLabel = countdownLabel(days);
                const totalQ = totalQuestionsInSession(s);
                const subjCount = (s.subjects || []).length;
                const testCount = Object.values(s.tests || {}).reduce((a, v) => a + v.length, 0);
                const dateFormatted = s.examDate
                    ? new Date(s.examDate).toLocaleDateString('uz-UZ', { day: '2-digit', month: 'long', year: 'numeric' })
                    : 'Sana belgilanmagan';

                return `
          <div class="col-12 col-md-6">
            <div class="session-card ${accentClass(s.examType)}" onclick="location.href='/preparation/session.html?id=${s.id}'">
              ${cdLabel ? `<div class="sc-countdown ${cdClass}"><i class="bi bi-alarm me-1"></i>${cdLabel}</div>` : ''}

              <div class="sc-header">
                <div class="sc-type-icon" style="background:${et ? et.gradient : '#2563eb'}">
                  <i class="bi ${et ? et.icon : 'bi-journals'}"></i>
                </div>
                <div class="sc-info">
                  <div class="sc-exam-name">${et ? et.label : s.examType}</div>
                  <div class="sc-date"><i class="bi bi-calendar3"></i>${dateFormatted}</div>
                </div>
                <div class="sc-percent-badge ${percentClass(pct)}">
                  <span>${pct}</span>
                  <span style="font-size:10px;font-weight:500;">%</span>
                </div>
              </div>

              <div class="sc-progress-wrap">
                <div class="sc-progress-track">
                  <div class="sc-progress-fill" style="width:${pct}%;background:${progressColor(pct)}"></div>
                </div>
              </div>

              <div class="sc-footer">
                ${s.examType === 'oraliq' ? (() => {
                        const oSub = getSubject(s.oraliqSubject);
                        const oData = window.ORALIQ_DATA ? (ORALIQ_DATA[s.oraliqSubject] || null) : null;
                        const qCount = oData ? oData.questions.length : 0;
                        const vStats = typeof getSessionVoiceStats === 'function' ? getSessionVoiceStats(s.id) : { questionsWithVoice: 0, totalVoices: 0 };
                        return `
                    <div class="sc-stat"><i class="bi bi-book"></i>${oSub ? oSub.label : 'Fan'}</div>
                    <div class="sc-stat"><i class="bi bi-chat-square-text"></i>${qCount} ta savol</div>
                    <div class="sc-stat"><i class="bi bi-mic"></i>${vStats.questionsWithVoice} ta yozilgan</div>
                  `;
                    })() : `
                    <div class="sc-stat"><i class="bi bi-book"></i>${subjCount} ta fan</div>
                    <div class="sc-stat"><i class="bi bi-ui-checks-grid"></i>${testCount} ta test</div>
                    <div class="sc-stat"><i class="bi bi-check-circle"></i>${stats.correctAnswers || 0} / ${Math.max(stats.solvedQuestions || 0, stats.correctAnswers || 0)} ta to'g'ri</div>
                `}
              </div>
            </div>
          </div>
        `;
            }).join('');

            container.innerHTML = `<div class="row g-3">${html}</div>`;
        }

        // ══════════════════════════════════════════════════════
        //  WIZARD STATE
        // ══════════════════════════════════════════════════════

        let wizStep = 1;
        let wizData = {
            examType: null,       // selected exam type id
            subjects: {},         // { subjectId: [testKey, ...] }  (yakuniy/grant)
            oraliqSubject: null,  // selected subject id (oraliq only)
            examDate: null
        };

        function openWizard() {
            wizStep = 1;
            wizData = { examType: null, subjects: {}, examDate: null };
            renderWizStep();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('wizardModal')).show();
        }

        function updateWizDots() {
            [1, 2, 3].forEach(n => {
                const el = document.getElementById('dot' + n);
                el.className = 'wsd ' + (n < wizStep ? 'done' : n === wizStep ? 'active' : '');
            });
            const isOraliq = wizData.examType === 'oraliq';
            const labels = [
                '1/3 – Imtihon turini tanlang',
                isOraliq ? '2/3 – Fanni tanlang' : '2/3 – Fanlar va testlarni tanlang',
                '3/3 – Imtihon sanasini belgilang'
            ];
            document.getElementById('wizardStepLabel').textContent = labels[wizStep - 1];
            document.getElementById('wizBtnBack').classList.toggle('d-none', wizStep === 1);
            const nextBtn = document.getElementById('wizBtnNext');
            // hide Next button on oraliq step 2 (auto-advances on card click)
            const hideNext = (wizData.examType === 'oraliq' && wizStep === 2);
            nextBtn.classList.toggle('d-none', hideNext);
            nextBtn.innerHTML = wizStep < 3
                ? 'Davom etish <i class="bi bi-arrow-right ms-1"></i>'
                : '<i class="bi bi-check-lg me-1"></i> Yaratish';
        }

        function renderWizStep() {
            updateWizDots();
            const body = document.getElementById('wizardBody');

            if (wizStep === 1) {
                document.getElementById('wizardTitle').textContent = "Imtihon turini tanlang";
                body.innerHTML = `
          <div class="d-flex flex-column gap-3">
            ${PREP_CONFIG.examTypes.map(et => `
              <div class="exam-type-card ${wizData.examType === et.id ? 'selected' : ''}"
                   onclick="selectExamType('${et.id}')">
                <div class="etc-icon" style="background:${et.gradient}">
                  <i class="bi ${et.icon}"></i>
                </div>
                <div>
                  <div class="etc-label">${et.label}</div>
                  <div class="etc-desc">${et.desc}</div>
                </div>
                <div class="ms-auto" id="etc-check-${et.id}" style="display:${wizData.examType === et.id ? 'block' : 'none'}">
                  <i class="bi bi-check-circle-fill text-primary fs-4"></i>
                </div>
              </div>
            `).join('')}
          </div>
        `;

            } else if (wizStep === 2) {
                // ── ORALIQ: only subject picker (no tests) ──
                if (wizData.examType === 'oraliq') {
                    document.getElementById('wizardTitle').textContent = 'Fanni tanlang';
                    const availableSubjects = PREP_CONFIG.subjects.filter(s => ORALIQ_DATA[s.id]);
                    body.innerHTML = `
                      <p style="font-size:13px;color:var(--tg-muted);margin-bottom:16px">
                        <i class="bi bi-info-circle me-1"></i>Oraliq nazorat uchun bitta fan tanlang.
                      </p>
                      <div class="d-flex flex-column gap-3">
                        ${availableSubjects.map(sub => {
                        const oData = ORALIQ_DATA[sub.id];
                        const qCount = oData ? oData.questions.length : 0;
                        const isSelected = wizData.oraliqSubject === sub.id;
                        return `
                            <div class="exam-type-card ${isSelected ? 'selected' : ''}"
                                 onclick="selectOraliqSubject('${sub.id}')">
                              <div class="etc-icon" style="background:${sub.bgColor}">
                                <i class="bi ${sub.icon}"></i>
                              </div>
                              <div>
                                <div class="etc-label">${sub.label}</div>
                                <div class="etc-desc">${qCount} ta og'zaki savol</div>
                              </div>
                              <div class="ms-auto" style="display:${isSelected ? 'block' : 'none'}" id="oraliq-check-${sub.id}">
                                <i class="bi bi-check-circle-fill text-primary fs-4"></i>
                              </div>
                            </div>
                          `;
                    }).join('')}
                      </div>
                    `;
                    validateWiz();
                    return;
                }
                // ── YAKUNIY / GRANT: subjects + tests ──
                document.getElementById('wizardTitle').textContent = "Fanlar va testlarni tanlang";
                const availableSubjects = getSubjectsForExamType(wizData.examType);
                body.innerHTML = availableSubjects.map(sub => {
                    const selectedTests = wizData.subjects[sub.id] || [];
                    const allKeys = sub.tests.map(t => t.key);
                    const allSelected = allKeys.every(k => selectedTests.includes(k));
                    const hasSelected = selectedTests.length > 0;

                    return `
            <div class="subject-row ${hasSelected ? 'has-selected' : ''}" id="sr-${sub.id}">
              <div class="subject-row-header" onclick="toggleSubjectRow('${sub.id}')">
                <div class="sr-icon" style="background:${sub.bgColor}">
                  <i class="bi ${sub.icon}"></i>
                </div>
                <div class="sr-label">${sub.label}</div>
                <span class="sr-count" id="src-${sub.id}">
                  ${selectedTests.length} / ${sub.tests.length}
                </span>
                <i class="bi bi-chevron-down sr-chevron"></i>
              </div>
              <div class="subject-row-body">
                <div class="select-all-row" onclick="toggleAllTests('${sub.id}')">
                  <input type="checkbox" id="chk-all-${sub.id}" ${allSelected ? 'checked' : ''} onclick="event.stopPropagation()">
                  <label for="chk-all-${sub.id}" style="cursor:pointer">Barchasini tanlash</label>
                </div>
                ${sub.tests.map(t => `
                  <div class="test-check-item" onclick="toggleTest('${sub.id}','${t.key}')">
                    <input type="checkbox" id="chk-${sub.id}-${t.key}"
                           ${selectedTests.includes(t.key) ? 'checked' : ''}
                           onclick="event.stopPropagation()">
                    <label for="chk-${sub.id}-${t.key}" class="tci-title" style="cursor:pointer">${t.title}</label>
                    <span class="tci-count">${t.count} ta</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
                }).join('');

            } else if (wizStep === 3) {
                document.getElementById('wizardTitle').textContent = "Imtihon sanasini belgilang";
                const today = new Date();
                const minDate = today.toISOString().split('T')[0];

                let summaryHtml = '';
                if (wizData.examType === 'oraliq') {
                    const sub = getSubject(wizData.oraliqSubject);
                    const oData = ORALIQ_DATA[wizData.oraliqSubject];
                    const qCount = oData ? oData.questions.length : 0;
                    summaryHtml = sub ? `
                      <div class="d-flex align-items-center gap-2 mb-2">
                        <div style="width:28px;height:28px;border-radius:8px;background:${sub.bgColor};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0">
                          <i class="bi ${sub.icon}"></i>
                        </div>
                        <span style="font-size:13px;font-weight:600">${sub.label}</span>
                        <span class="ms-auto" style="font-size:12px;color:var(--tg-muted)">${qCount} ta og'zaki savol</span>
                      </div>
                    ` : '';
                } else {
                    const selectedCount = Object.values(wizData.subjects).reduce((a, v) => a + v.length, 0);
                    summaryHtml = Object.entries(wizData.subjects).map(([subId, keys]) => {
                        const sub = getSubject(subId);
                        return sub ? `<div class="d-flex align-items-center gap-2 mb-2">
                          <div style="width:28px;height:28px;border-radius:8px;background:${sub.bgColor};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0">
                            <i class="bi ${sub.icon}"></i>
                          </div>
                          <span style="font-size:13px;font-weight:600">${sub.label}</span>
                          <span class="ms-auto" style="font-size:12px;color:var(--tg-muted)">${keys.length} ta test</span>
                        </div>` : '';
                    }).join('');
                }

                body.innerHTML = `
                  <div class="date-input-wrap mb-4">
                    <div class="date-label">Imtihon sanasi</div>
                    <input type="date" id="examDateInput" value="${wizData.examDate || ''}" min="${minDate}">
                  </div>
                  <div style="background:#f8fafc;border-radius:16px;padding:16px;">
                    <div style="font-size:12px;font-weight:700;color:var(--tg-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px">
                      <i class="bi bi-list-check me-1"></i>
                      ${wizData.examType === 'oraliq' ? "Og'zaki imtihon" : 'Tanlangan testlar'}
                    </div>
                    ${summaryHtml}
                  </div>
                `;
            }

            // validate next btn
            validateWiz();
        }

        function validateWiz() {
            const btn = document.getElementById('wizBtnNext');
            if (wizStep === 1) {
                btn.disabled = !wizData.examType;
            } else if (wizStep === 2) {
                if (wizData.examType === 'oraliq') {
                    btn.disabled = !wizData.oraliqSubject;
                } else {
                    const hasAny = Object.values(wizData.subjects).some(v => v.length > 0);
                    btn.disabled = !hasAny;
                }
            } else {
                btn.disabled = false; // date optional
            }
        }

        function selectExamType(id) {
            wizData.examType = id;
            wizData.subjects = {};
            wizData.oraliqSubject = null;
            renderWizStep();
        }

        function selectOraliqSubject(subId) {
            wizData.oraliqSubject = subId;
            // update UI briefly, then auto-advance
            document.querySelectorAll('[id^="oraliq-check-"]').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.exam-type-card').forEach(el => el.classList.remove('selected'));
            const checkEl = document.getElementById('oraliq-check-' + subId);
            if (checkEl) { checkEl.style.display = 'block'; checkEl.closest('.exam-type-card').classList.add('selected'); }
            // auto-proceed to next step after a brief visual feedback
            setTimeout(function() { wizNext(); }, 250);
        }

        function toggleSubjectRow(subId) {
            const row = document.getElementById('sr-' + subId);
            row.classList.toggle('open');
        }

        function toggleTest(subId, testKey) {
            const selected = wizData.subjects[subId] || [];
            const idx = selected.indexOf(testKey);
            if (idx === -1) selected.push(testKey);
            else selected.splice(idx, 1);
            wizData.subjects[subId] = selected;
            if (selected.length === 0) delete wizData.subjects[subId];
            updateSubjectRowUI(subId);
            validateWiz();
        }

        function toggleAllTests(subId) {
            const sub = getSubject(subId);
            if (!sub) return;
            const allKeys = sub.tests.map(t => t.key);
            const selected = wizData.subjects[subId] || [];
            const allSelected = allKeys.every(k => selected.includes(k));
            if (allSelected) {
                delete wizData.subjects[subId];
            } else {
                wizData.subjects[subId] = [...allKeys];
            }
            updateSubjectRowUI(subId);
            validateWiz();
        }

        function updateSubjectRowUI(subId) {
            const sub = getSubject(subId);
            if (!sub) return;
            const selected = wizData.subjects[subId] || [];
            const allKeys = sub.tests.map(t => t.key);

            // update count badge
            const countEl = document.getElementById('src-' + subId);
            if (countEl) countEl.textContent = `${selected.length} / ${sub.tests.length}`;

            // update row border
            const row = document.getElementById('sr-' + subId);
            if (row) row.classList.toggle('has-selected', selected.length > 0);

            // update individual checkboxes
            sub.tests.forEach(t => {
                const chk = document.getElementById(`chk-${subId}-${t.key}`);
                if (chk) chk.checked = selected.includes(t.key);
            });

            // update select-all checkbox
            const allChk = document.getElementById(`chk-all-${subId}`);
            if (allChk) allChk.checked = allKeys.every(k => selected.includes(k));
        }

        function wizNext() {
            if (wizStep === 1 && !wizData.examType) return;
            if (wizStep === 2) {
                if (wizData.examType === 'oraliq') {
                    if (!wizData.oraliqSubject) { alert("Fan tanlang!"); return; }
                } else {
                    const hasAny = Object.values(wizData.subjects).some(v => v.length > 0);
                    if (!hasAny) { alert("Kamida 1 ta test tanlang!"); return; }
                }
            }
            if (wizStep === 3) {
                // read date
                const dateInput = document.getElementById('examDateInput');
                wizData.examDate = dateInput?.value || null;
                saveSession();
                return;
            }
            wizStep++;
            renderWizStep();
        }

        function wizBack() {
            if (wizStep <= 1) return;
            wizStep--;
            renderWizStep();
        }

        function saveSession() {
            const id = 'prep_' + Date.now();
            const isOraliq = wizData.examType === 'oraliq';
            const session = {
                id,
                examType: wizData.examType,
                examDate: wizData.examDate || null,
                createdAt: new Date().toISOString(),
                subjects: isOraliq ? [wizData.oraliqSubject] : Object.keys(wizData.subjects),
                tests: isOraliq ? {} : wizData.subjects,
                oraliqSubject: isOraliq ? wizData.oraliqSubject : null,
                stats: {
                    totalQuestions: 0,
                    solvedQuestions: 0,
                    correctAnswers: 0,
                    wrongAnswers: 0,
                    accuracy: 0,
                    updatedAt: null
                },
                subjectStats: {},
                testResults: [],
                startedAt: null,
                lastActivityAt: null
            };

            createSession(session);
            bootstrap.Modal.getOrCreateInstance(document.getElementById('wizardModal')).hide();
            renderSessions();

            // Navigate to the new session
            setTimeout(() => {
                location.href = `/preparation/session.html?id=${id}`;
            }, 300);
        }

        // ── INIT ──────────────────────────────────────────────
        renderSessions();
    </script>

</body>

</html>
