<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preparation Mode</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Project styles -->
    <link rel="stylesheet" href="/assets/styles/styles.css">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--tg-bg);
            color: var(--tg-text);
            padding-bottom: 85px;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid #e9eef5;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.03);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 17px;
            color: var(--tg-text) !important;
            letter-spacing: -0.3px;
        }

        .navbar-brand img {
            border: 2px solid #fff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .navbar .btn-light {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: var(--tg-text);
            padding: 6px 14px;
            transition: .2s ease;
        }

        .navbar .btn-light:hover {
            background: #e2e8f0;
        }

        /* PAGE HEADER */
        .page-header {
            padding: 28px 0 14px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--tg-text);
            letter-spacing: -0.5px;
        }

        .page-header p {
            color: var(--tg-muted);
            font-size: 14px;
            margin-bottom: 0;
        }

        /* SUBJECT NAV */
        .subject-nav {
            position: sticky;
            top: 66px;
            z-index: 1020;
            background: var(--tg-bg);
            padding: 10px 0 14px;
            margin-bottom: 6px;
        }

        .subject-nav::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 14px;
            background: linear-gradient(to bottom, var(--tg-bg), transparent);
            pointer-events: none;
        }

        .subject-pills {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .subject-pills::-webkit-scrollbar {
            display: none;
        }

        .subject-pill {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #e2e8f0;
            color: var(--tg-text);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: all .2s ease;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        .subject-pill i {
            font-size: 14px;
        }

        .subject-pill:hover {
            background: #f8fafc;
            transform: translateY(-1px);
        }

        .subject-pill.active {
            background: var(--tg-text);
            color: #fff;
            border-color: var(--tg-text);
        }

        /* GROUP SECTION */
        .group-section {
            margin-bottom: 14px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
            overflow: hidden;
        }

        .group-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            cursor: pointer;
            user-select: none;
            transition: background .2s ease;
        }

        .group-header:hover {
            background: #f8fafc;
        }

        .group-icon {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
        }

        .group-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--tg-text);
        }

        .group-title-wrap {
            flex-grow: 1;
            min-width: 0;
        }

        .group-total {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-muted);
        }

        .group-total i {
            font-size: 11px;
        }

        .group-count-badge {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border-radius: 999px;
            background: #f1f5f9;
            color: var(--tg-text);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .group-count-badge i {
            font-size: 11px;
            color: var(--tg-muted);
        }

        .group-chevron {
            margin-left: 10px;
            font-size: 18px;
            color: var(--tg-muted);
            transition: transform .25s ease;
        }

        .group-section.open .group-chevron {
            transform: rotate(180deg);
        }

        .group-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease, padding .35s ease;
            padding: 0 18px;
        }

        .group-section.open .group-body {
            max-height: 2000px;
            padding: 4px 18px 18px;
        }

        /* TEST CARD */
        .test-card {
            text-decoration: none;
            display: block;
        }

        .test-card .test-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            font-size: 20px;
        }

        .test-card .test-title {
            font-size: 13px;
            font-weight: 600;
        }

        .test-card .question-footer {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* SESSIONS */
        .sessions-section {
            margin-top: 32px;
        }

        .section-heading {
            font-size: 18px;
            font-weight: 700;
            color: var(--tg-text);
            margin-bottom: 14px;
        }

        .session-card {
            background: #fff;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .session-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
        }

        .session-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--tg-text);
        }

        .session-meta {
            font-size: 12px;
            color: var(--tg-muted);
            margin-top: 2px;
        }

        .session-progress {
            height: 8px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
            margin: 12px 0 8px;
        }

        .session-progress-bar {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #0d6efd, #00c6ff);
            transition: width .4s ease;
        }

        .session-stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--tg-muted);
            margin-bottom: 12px;
        }

        .session-stats span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .session-actions {
            display: flex;
            gap: 8px;
        }

        .session-actions .btn {
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
        }

        .empty-state i {
            font-size: 48px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--tg-text);
        }

        .empty-state p {
            font-size: 13px;
            color: var(--tg-muted);
            margin-bottom: 0;
        }

        /* MODAL */
        .modal-content {
            border-radius: 24px;
            border: none;
        }

        .prep-step-item {
            width: 100%;
            text-align: left;
            display: block;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #fff;
            color: var(--tg-text);
            font-weight: 600;
            transition: all .2s ease;
        }

        .prep-step-item:hover {
            border-color: #0d6efd;
            background: #f4f8ff;
        }

        .prep-step-item.active {
            border-color: #0d6efd;
            background: #0d6efd;
            color: #fff;
        }

        .subject-card .text-muted {
            font-size: 12px;
            font-weight: 500;
        }

        .subject-card.active .text-muted {
            color: rgba(255, 255, 255, 0.85) !important;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(18px);
            border-top: 1px solid #e5eaf1;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1050;
        }

        .bottom-nav .nav-item {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
            transition: .2s ease;
        }

        .bottom-nav .nav-item i {
            display: block;
            font-size: 21px;
            margin-bottom: 2px;
        }

        .bottom-nav .nav-item.active {
            color: #0d6efd;
        }

        .bottom-nav .nav-item:hover {
            color: #0d6efd;
        }

        /* MOBILE */
        @media(max-width:768px) {
            .page-header h1 {
                font-size: 22px;
            }

            .group-title {
                font-size: 15px;
            }

            .subject-nav {
                top: 62px;
            }

            .group-count-badge {
                display: none;
            }
        }
    </style>
</head>

<body data-page="prep-index">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="/assets/img/PulseGo.jpg" width="40" height="40" class="rounded-circle">
                Pulse Go
            </a>
            <a href="/tests" class="btn btn-light btn-sm">
                <i class="bi bi-ui-checks-grid"></i> Testlar
            </a>
        </div>
    </nav>

    <!-- PAGE HEADER -->
    <section class="page-header">
        <div class="container">
            <div
                class="d-flex justify-content-between align-items-start align-items-md-center flex-column flex-md-row gap-3">
                <div>
                    <h1>Preparation Mode</h1>
                    <p>Yangi tayyorgarlik sessiyalarini yarating va progressni saqlang.</p>
                </div>
                <button id="new-prep-button" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-plus-lg"></i> New Preparation
                </button>
            </div>
        </div>
    </section>

    <!-- SUBJECT NAV -->
    <div class="subject-nav">
        <div class="container">
            <div class="subject-pills" id="subject-pills">
                <!-- Pills rendered from prep-data.js -->
            </div>
        </div>
    </div>

    <!-- SUBJECT GROUPS -->
    <section class="prep-section">
        <div class="container">
            <div id="groups-container">
                <!-- Groups rendered from prep-data.js -->
            </div>

            <!-- SESSIONS -->
            <div class="sessions-section">
                <div class="section-heading">Mening sessiyalarim</div>
                <div class="row g-3" id="prep-cards">
                    <!-- Sessions rendered by preparation.js -->
                </div>
            </div>
        </div>
    </section>

    <!-- CREATE SESSION MODAL -->
    <div class="modal fade" id="createPrepModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <div>
                        <h5 class="modal-title fw-bold" id="create-prep-step-title">1. Imtihon turini tanlang</h5>
                        <div class="text-muted small">Boshlash uchun imtihon turini va mavzuni tanlang.</div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="step-1">
                        <div class="mb-3 fw-semibold">Exam type</div>
                        <div class="d-flex gap-2 flex-wrap" id="exam-type-list"></div>
                    </div>
                    <div id="step-2" class="d-none">
                        <div class="mb-3">
                            <div class="fw-semibold">Subject</div>
                            <div class="text-muted small">Tanlangan imtihon: <span id="selectedExamType">-</span></div>
                        </div>
                        <div class="row g-3" id="subject-list"></div>
                    </div>
                </div>
                <div class="modal-footer border-0 d-flex justify-content-between">
                    <button id="create-prep-back" type="button" class="btn btn-outline-secondary"
                        style="display:none;">Back</button>
                    <div>
                        <button id="create-prep-next" type="button" class="btn btn-primary" disabled>Next</button>
                        <button id="create-prep-finish" type="button" class="btn btn-primary d-none" disabled>Start
                            Session</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav d-lg-none">
        <a href="/" class="nav-item">
            <i class="bi bi-house-fill"></i>
            <span>Asosiy</span>
        </a>
        <a href="/tests" class="nav-item">
            <i class="bi bi-ui-checks-grid"></i>
            <span>Testlar</span>
        </a>
        <a href="/preparation" class="nav-item active">
            <i class="bi bi-journal-bookmark-fill"></i>
            <span>Tayyorgarlik</span>
        </a>
        <a href="/profile" class="nav-item">
            <i class="bi bi-person"></i>
            <span>Profil</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/data.js"></script>
    <script src="prep-data.js"></script>
    <script src="preparation.js"></script>
</body>

</html>
