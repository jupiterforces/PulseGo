<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests Authentication | Pulse Go</title>
    <meta name="description" content="Pulse Go tests autentifikatsiyasi">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --pulse-primary: #2563eb;
            --pulse-primary-dark: #1d4ed8;
            --pulse-text: #0f172a;
            --pulse-muted: #64748b;
            --pulse-border: #e2e8f0;
            --pulse-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            color: var(--pulse-text);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 35px 15px;
            background:
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, .10), transparent 35%),
                radial-gradient(circle at 90% 90%, rgba(99, 102, 241, .08), transparent 35%),
                #f8fafc;
        }

        .decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .decoration {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
        }

        .decoration-1 {
            width: 350px;
            height: 350px;
            background: rgba(59, 130, 246, .07);
            top: -180px;
            left: -120px;
        }

        .decoration-2 {
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, .06);
            bottom: -160px;
            right: -100px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .auth-card {
            background: rgba(255, 255, 255, .96);
            border: 1px solid rgba(226, 232, 240, .9);
            border-radius: 28px;
            padding: 34px;
            box-shadow:
                0 30px 80px rgba(15, 23, 42, .08),
                0 8px 25px rgba(15, 23, 42, .04);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(15, 23, 42, .12);
        }

        .brand-info {
            text-align: left;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -.4px;
            margin: 0;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--pulse-muted);
            margin-top: 2px;
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .heading-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 17px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            color: var(--pulse-primary);
            font-size: 24px;
        }

        .auth-heading h1 {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -.7px;
            margin-bottom: 8px;
            margin: 0 0 8px;
        }

        .auth-heading p {
            color: var(--pulse-muted);
            font-size: 13px;
            line-height: 1.6;
            margin: 0 auto;
            max-width: 340px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--pulse-border);
            background: var(--pulse-bg);
            border-radius: 15px;
            margin-bottom: 22px;
        }

        .user-photo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--pulse-primary);
        }

        .user-details {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 13px;
            font-weight: 700;
            margin: 0;
        }

        .user-email {
            color: var(--pulse-muted);
            font-size: 11px;
            margin-top: 2px;
            word-break: break-all;
        }

        .verified-badge {
            color: #16a34a;
            font-size: 18px;
        }

        .google-btn {
            width: 100%;
            height: 54px;
            border-radius: 14px;
            border: 1px solid var(--pulse-border);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            color: var(--pulse-text);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform .2s ease,
                box-shadow .2s ease,
                border-color .2s ease;
        }

        .google-btn:hover {
            transform: translateY(-1px);
            border-color: #cbd5e1;
            box-shadow: 0 8px 20px rgba(15, 23, 42, .08);
        }

        .google-btn:disabled {
            opacity: .65;
            cursor: wait;
            transform: none;
        }

        .google-icon {
            display: flex;
        }

        .logout-btn {
            width: 100%;
            height: 54px;
            border-radius: 14px;
            border: 1px solid #fee2e2;
            background: #fef2f2;
            color: #dc2626;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform .2s ease,
                box-shadow .2s ease;
            margin-top: 12px;
        }

        .logout-btn:hover {
            transform: translateY(-1px);
            border-color: #fecaca;
            box-shadow: 0 8px 20px rgba(220, 38, 38, .1);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: var(--pulse-border);
            flex: 1;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: var(--pulse-muted);
            font-size: 11px;
        }

        .security-note i {
            color: #16a34a;
            font-size: 14px;
        }

        .auth-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: #94a3b8;
            font-size: 10px;
            margin-top: 28px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 576px) {
            body {
                padding: 15px;
            }

            .auth-card {
                padding: 25px 20px;
                border-radius: 22px;
            }

            .brand {
                margin-bottom: 28px;
            }

            .auth-heading h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="decorations">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- BRAND -->
            <div class="brand">
                <img src="/assets/img/PulseGo.jpg" alt="Pulse Go" class="brand-logo">
                <div class="brand-info">
                    <h2 class="brand-name">Pulse Go</h2>
                    <p class="brand-subtitle">Tibbiy ta'lim platformasi</p>
                </div>
            </div>

            <!-- LOGIN VIEW -->
            <div id="loginView">
                <div class="auth-heading">
                    <div class="heading-icon">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <h1>Tests Kirish</h1>
                    <p>Pulse Go test platformasiga kiring va o'zingizni sinab ko'ring.</p>
                </div>

                <button id="loginBtn" class="google-btn">
                    <span class="google-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.95 2.94v2.45h3.15c1.85-1.7 2.91-4.2 2.91-7.42z" />
                            <path fill="#34A853"
                                d="M12 21.6c2.65 0 4.88-.88 6.5-2.38l-3.15-2.45c-.87.58-1.98.92-3.35.92-2.57 0-4.75-1.73-5.53-4.06H3.22v2.53A9.82 9.82 0 0 0 12 21.6z" />
                            <path fill="#FBBC05"
                                d="M6.47 13.63A5.9 5.9 0 0 1 6.16 12c0-.57.1-1.12.31-1.63V7.84H3.22A9.82 9.82 0 0 0 2.2 12c0 1.58.38 3.07 1.02 4.16l3.25-2.53z" />
                            <path fill="#EA4335"
                                d="M12 6.31c1.44 0 2.73.5 3.75 1.49l2.8-2.8C16.88 3.4 14.65 2.4 12 2.4a9.82 9.82 0 0 0-8.78 5.44l3.25 2.53C7.25 8.04 9.43 6.31 12 6.31z" />
                        </svg>
                    </span>
                    <span>Google bilan davom etish</span>
                </button>

                <div class="divider">
                    <span>yoki</span>
                </div>

                <div class="security-note">
                    <i class="bi bi-shield-check"></i>
                    <span>Xavfsiz Google autentifikatsiyasi</span>
                </div>
            </div>

            <!-- LOGGED IN VIEW -->
            <div id="loggedInView" class="hidden">
                <div class="auth-heading">
                    <div class="heading-icon" style="background: #f0fdf4; color: #16a34a;">
                        <i class="bi bi-person-vcard-fill"></i>
                    </div>
                    <h1>Kirish muvaffaqiyatli</h1>
                    <p>Sizga test variantlari tayyar.</p>
                </div>

                <div id="userBox" class="user-info">
                    <img id="userPhoto" class="user-photo" alt="Profile">
                    <div class="user-details">
                        <p id="userName" class="user-name">Foydalanuvchi</p>
                        <p id="userEmail" class="user-email">email@example.com</p>
                    </div>
                    <i class="bi bi-check-circle-fill verified-badge"></i>
                </div>

                <button id="logoutBtn" class="logout-btn">
                    <i class="bi bi-box-arrow-right"></i> Chiqish
                </button>
            </div>

            <div class="auth-footer">
                <span>© 2026 Pulse Go</span>
                <span>•</span>
                <span>Medical Education</span>
            </div>
        </div>
    </div>


    <script type="module">
        import { auth, provider } from "./firebase.js";
        import { signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const loginView = document.getElementById("loginView");
        const loggedInView = document.getElementById("loggedInView");
        const userPhoto = document.getElementById("userPhoto");
        const userName = document.getElementById("userName");
        const userEmail = document.getElementById("userEmail");

        loginBtn.addEventListener("click", async () => {
            loginBtn.disabled = true;
            try {
                await signInWithPopup(auth, provider);
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get("redirect") || "/tests/";
                window.location.href = redirect;
            } catch (e) {
                console.error(e);
                loginBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener("click", async () => {
            logoutBtn.disabled = true;
            try {
                await signOut(auth);
                logoutBtn.disabled = false;
            } catch (e) {
                console.error(e);
                logoutBtn.disabled = false;
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userPhoto.src = user.photoURL || "/assets/img/PulseGo.jpg";
                userName.textContent = user.displayName || "Foydalanuvchi";
                userEmail.textContent = user.email || "";
                loginView.classList.add("hidden");
                loggedInView.classList.remove("hidden");
            } else {
                loginView.classList.remove("hidden");
                loggedInView.classList.add("hidden");
            }
        });
    </script>

</body>

</html>
