<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons - Pulse Medical</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/styles/styles.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7fb 0%, #e8f2ff 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, #2563eb, #1d4ed8) !important;
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.15);
            padding: 12px 0 !important;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: clamp(1rem, 3vw, 1.3rem);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-brand img {
            width: clamp(32px, 5vw, 40px);
            height: clamp(32px, 5vw, 40px);
        }

        .hero-section {
            text-align: center;
            padding: clamp(24px, 5vw, 40px) clamp(16px, 3vw, 20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.7) 100%);
            border-radius: 20px;
            margin: clamp(16px, 3vw, 20px) auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .hero-title {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            color: #64748b;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: clamp(12px, 3vw, 20px);
            padding: clamp(12px, 3vw, 20px);
            max-width: 1400px;
            margin: 0 auto;
        }

        .subject-card {
            background: white;
            border-radius: 16px;
            padding: clamp(16px, 3vw, 24px);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .subject-card:hover::before {
            left: 100%;
        }

        .subject-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 1);
            border-color: #2563eb;
        }

        @media (hover: none) {
            .subject-card:active {
                transform: translateY(-4px);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            }
        }

        .subject-icon {
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            margin-bottom: 12px;
            display: block;
            transition: transform 0.3s ease;
        }

        .subject-card:hover .subject-icon {
            transform: scale(1.1);
        }

        .subject-name {
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subject-description {
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .subject-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
            background: var(--color);
            opacity: 0.9;
        }

        .container-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 12px;
        }

        @media (min-width: 1024px) {
            .container-main {
                padding: 0 20px;
            }
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: white;
            border: none;
            border-radius: 12px;
            color: #2563eb;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            background: #f1f5f9;
            transform: translateX(-4px);
        }

        footer {
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
            color: white;
            padding: 30px 20px;
            text-align: center;
            margin-top: 40px;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
        }

        /* MOBILE OPTIMIZATIONS */
        @media (max-width: 768px) {
            body {
                padding-bottom: 20px;
            }

            .navbar {
                padding: 10px 0 !important;
            }

            .navbar-brand {
                font-size: 1.1rem;
            }

            .hero-section {
                padding: 24px 14px;
                margin: 12px auto;
                border-radius: 16px;
            }

            .hero-title {
                font-size: clamp(1.4rem, 5vw, 2.2rem);
            }

            .hero-subtitle {
                font-size: 0.9rem;
            }

            .subjects-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 12px;
                padding: 12px;
            }

            .subject-card {
                padding: 16px 12px;
                min-height: 220px;
                border-radius: 14px;
            }

            .subject-icon {
                font-size: 2.4rem;
            }

            .subject-name {
                font-size: 1rem;
                margin: 8px 0;
            }

            footer {
                padding: 20px 16px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 8px 0 !important;
            }

            .navbar-brand {
                font-size: 1rem;
                gap: 6px;
            }

            .navbar-brand img {
                width: 32px;
                height: 32px;
            }

            .hero-section {
                padding: 16px 12px;
                margin: 8px auto;
                border-radius: 12px;
            }

            .hero-title {
                font-size: 1.5rem;
                margin-bottom: 8px;
            }

            .hero-subtitle {
                font-size: 0.8rem;
                line-height: 1.4;
            }

            .subjects-grid {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 10px;
                padding: 10px;
            }

            .subject-card {
                padding: 12px 10px;
                min-height: 200px;
                border-radius: 12px;
            }

            .subject-icon {
                font-size: 2rem;
            }

            .subject-name {
                font-size: 0.9rem;
                margin: 6px 0;
            }

            .subject-description {
                font-size: 0.7rem;
                margin-bottom: 8px;
            }

            .subject-badge {
                padding: 4px 10px;
                font-size: 0.7rem;
            }

            footer {
                padding: 16px 12px;
                font-size: 0.75rem;
                margin-top: 20px;
            }
        }

        @media (max-width: 480px) {
            .subjects-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 10px;
                padding: 10px;
            }

            .subject-card {
                padding: 14px 10px;
                min-height: 200px;
            }
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a href="../../index.html" class="navbar-brand d-flex align-items-center gap-2">
                <img src="../../assets/img/PulseGo.jpg" width="40" height="40" class="rounded-circle">
                Pulse Go
            </a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="container-main">
        <div class="hero-section">
            <h1 class="hero-title">📚 Lessons</h1>
            <!-- <p class="hero-subtitle">Choose a subject to explore comprehensive lessons with video tutorials</p> -->
        </div>

        <!-- SUBJECTS GRID -->
        <div class="subjects-grid" id="subjectsContainer">
            <!-- Dynamically populated -->
        </div>
    </div>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/data.js"></script>

    <script>
        // Load and display subjects
        function loadSubjects() {
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';

            LESSONS_DATA.subjects.forEach(subject => {
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.style.setProperty('--color', subject.color);
                card.innerHTML = `
                    <span class="subject-icon">${subject.icon}</span>
                    <h3 class="subject-name">${subject.name}</h3>
                    <p class="subject-description">${subject.description}</p>
                    <span class="subject-badge">Darsni boshlash</span>
                `;

                card.addEventListener('click', () => {
                    window.location.href = `./${subject.id}/index.html`;
                });

                container.appendChild(card);
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadSubjects);
    </script>
</body>

</html>
