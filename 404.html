<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Pulse Go</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f8fafc;
            color: #1e293b;
            padding: 24px;
        }

        .error-container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 45px;

            font-size: 22px;
            font-weight: 800;
            color: #198754;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;
            background: #198754;
            color: white;

            font-size: 21px;
            box-shadow: 0 8px 20px rgba(25, 135, 84, 0.18);
        }

        .error-code {
            font-size: clamp(90px, 20vw, 150px);
            line-height: .9;
            font-weight: 900;
            letter-spacing: -8px;
            color: #198754;

            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(28px, 6vw, 38px);
            font-weight: 800;
            margin-bottom: 14px;
            color: #172033;
        }

        p {
            font-size: 16px;
            line-height: 1.7;
            color: #64748b;
            max-width: 400px;
            margin: 0 auto 30px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 13px 22px;

            border-radius: 12px;
            background: #198754;
            color: white;

            text-decoration: none;
            font-size: 15px;
            font-weight: 700;

            box-shadow: 0 8px 20px rgba(25, 135, 84, 0.18);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .back-button:hover {
            background: #157347;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(25, 135, 84, 0.25);
        }

        .arrow {
            font-size: 18px;
            transition: transform .2s ease;
        }

        .back-button:hover .arrow {
            transform: translateX(-3px);
        }

        .footer {
            margin-top: 55px;
            font-size: 13px;
            color: #94a3b8;
        }

        @media (max-width: 500px) {
            .logo {
                margin-bottom: 35px;
            }

            .error-code {
                letter-spacing: -5px;
            }

            .footer {
                margin-top: 40px;
            }
        }
    </style>
</head>

<body>

    <main class="error-container">

        <a href="/" class="logo">
            <span class="logo-icon">+</span>
            <span>Pulse Go</span>
        </a>

        <div class="error-code">
            404
        </div>

        <h1>Page not found</h1>

        <p>
            The page you're looking for
            doesn't exist or was moved.
        </p>

        <a href="/" class="back-button">
            <span class="arrow">←</span>
            Back to Pulse Go
        </a>

        <div class="footer">
            © 2026 Pulse Go
        </div>

    </main>

</body>

</html>
