<!doctype html>
<html lang="uz">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profil — Pulse Go</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="/assets/styles/styles.css" rel="stylesheet" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--tg-bg);
            color: var(--tg-text);
            padding-bottom: 90px;
        }

        .navbar {
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #e9eef5;
            box-shadow: 0 4px 14px rgba(15, 23, 42, .04);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 17px;
            color: var(--tg-text) !important;
        }

        .section {
            padding: 18px 0;
        }

        .profile-card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 6px 24px rgba(15, 23, 42, .07);
            padding: 18px;
        }

        .pc-head {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .pc-avatar {
            width: 62px;
            height: 62px;
            border-radius: 20px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pc-name {
            font-size: 20px;
            font-weight: 900;
            line-height: 1.1;
        }

        .pc-joined {
            font-size: 12px;
            color: var(--tg-muted);
        }

        .pc-about {
            font-size: 14px;
            color: var(--tg-muted);
            margin: 10px 0 14px;
        }

        .btn-soft {
            border: none;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-tile {
            background: #fff;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, .06);
        }

        .st-icon {
            width: 34px;
            height: 34px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .st-val {
            font-size: 21px;
            font-weight: 900;
            line-height: 1;
        }

        .st-label {
            font-size: 11px;
            color: var(--tg-muted);
            margin-top: 4px;
            font-weight: 600;
        }

        .accuracy-card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 6px 24px rgba(15, 23, 42, .07);
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .ring-wrap {
            width: 92px;
            height: 92px;
            position: relative;
            flex-shrink: 0;
        }

        .ring-wrap svg {
            width: 92px;
            height: 92px;
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 9;
        }

        .ring-fg {
            fill: none;
            stroke: #16a34a;
            stroke-width: 9;
            stroke-linecap: round;
            stroke-dasharray: 245;
            stroke-dashoffset: 245;
            transition: stroke-dashoffset .6s ease;
        }

        .ring-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 900;
        }

        .mistakes-card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 6px 24px rgba(15, 23, 42, .07);
            padding: 16px;
        }

        .mistake-test {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .mistake-head {
            background: #f8fafc;
            padding: 11px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mistake-head h6 {
            margin: 0;
            font-size: 14px;
            font-weight: 800;
            flex: 1;
        }

        .mistake-count {
            font-size: 11px;
            font-weight: 700;
            color: var(--tg-muted);
            background: #e2e8f0;
            border-radius: 999px;
            padding: 2px 8px;
        }

        .mistake-body {
            display: none;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
        }

        .mistake-body.open {
            display: block;
        }

        .mistake-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .mi-q {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .mi-row {
            font-size: 12px;
            margin-bottom: 4px;
        }

        .mi-row.user {
            color: #dc2626;
        }

        .mi-row.correct {
            color: #16a34a;
        }

        .empty-state {
            text-align: center;
            padding: 28px 12px;
            color: var(--tg-muted);
            font-size: 14px;
        }
    </style>
</head>

<body>

    <nav class="navbar sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="navbar-brand d-flex align-items-center gap-2">
                <img src="/assets/img/PulseGo.jpg" width="40" height="40" class="rounded-circle">
                Pulse Go
            </a>
            <a href="/" class="btn btn-light btn-sm rounded-pill"><i class="bi bi-house"></i> Home</a>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <div class="profile-card">
                <div class="pc-head">
                    <div class="pc-avatar" id="profileAvatar">P</div>
                    <div>
                        <div class="pc-name" id="profileName">Foydalanuvchi</div>
                        <div class="pc-joined" id="profileJoined">Qo'shilgan sana: -</div>
                    </div>
                </div>
                <div class="pc-about" id="profileAbout">Profil ma'lumotlari mavjud emas.</div>
                <div class="d-flex gap-2">
                    <button class="btn-soft" id="editProfileBtn"><i class="bi bi-pencil-square me-1"></i>Tahrirlash</button>
                    <button class="btn-soft" id="refreshBtn"><i class="bi bi-arrow-clockwise me-1"></i>Yangilash</button>
                </div>
            </div>
        </div>
    </section>

    <section class="section pt-0">
        <div class="container">
            <div class="overview-grid mb-3">
                <div class="stat-tile">
                    <div class="st-icon" style="background:#eff6ff;color:#2563eb"><i class="bi bi-ui-checks-grid"></i></div>
                    <div class="st-val" id="stTests">0</div>
                    <div class="st-label">Jami testlar</div>
                </div>
                <div class="stat-tile">
                    <div class="st-icon" style="background:#f0fdf4;color:#16a34a"><i class="bi bi-check2-circle"></i></div>
                    <div class="st-val" id="stCorrect">0</div>
                    <div class="st-label">To'g'ri javob</div>
                </div>
                <div class="stat-tile">
                    <div class="st-icon" style="background:#fdf4ff;color:#7c3aed"><i class="bi bi-journals"></i></div>
                    <div class="st-val" id="stSessions">0</div>
                    <div class="st-label">Tayyorlanish sessiyasi</div>
                </div>
                <div class="stat-tile">
                    <div class="st-icon" style="background:#fff7ed;color:#ea580c"><i class="bi bi-exclamation-triangle-fill"></i></div>
                    <div class="st-val" id="stMistakes">0</div>
                    <div class="st-label">Aktiv xatolar</div>
                </div>
            </div>

            <div class="accuracy-card">
                <div class="ring-wrap">
                    <svg viewBox="0 0 100 100">
                        <circle class="ring-bg" cx="50" cy="50" r="39"></circle>
                        <circle class="ring-fg" id="accuracyRing" cx="50" cy="50" r="39"></circle>
                    </svg>
                    <div class="ring-text" id="accuracyText">0%</div>
                </div>
                <div>
                    <div style="font-size:15px;font-weight:800">Umumiy aniqlik</div>
                    <div style="font-size:13px;color:var(--tg-muted)" id="accuracyDetail">0 / 0 to'g'ri javob</div>
                </div>
            </div>
        </div>
    </section>

    <section class="section pt-0">
        <div class="container">
            <div class="mistakes-card">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-clipboard2-pulse me-2 text-danger"></i>Xatolar tahlili</h5>
                    <div class="d-flex gap-2">
                        <a href="/xatolar/?action=view" class="btn btn-light btn-sm rounded-pill">Mavzular</a>
                        <a href="/xatolar/?action=review" class="btn btn-light btn-sm rounded-pill">Qayta yechish</a>
                    </div>
                </div>
                <div id="mistakesList"></div>
            </div>
        </div>
    </section>

    <nav class="bottom-nav d-lg-none">
        <a href="/" class="bn-item">
            <i class="bi bi-house-fill"></i>
            <span>Asosiy</span>
        </a>
        <a href="/tests/" class="bn-item">
            <i class="bi bi-grid-3x3-gap-fill"></i>
            <span>QBank</span>
        </a>
        <a href="/preparation/" class="bn-item bn-fab">
            <span class="bn-fab-btn"><i class="bi bi-plus-lg"></i></span>
            <span>Tayyorlanish</span>
        </a>
        <a href="/lessons" class="bn-item">
            <i class="bi bi-book-half"></i>
            <span>Darslar</span>
        </a>
        <a href="/profile" class="bn-item active">
            <i class="bi bi-person-fill"></i>
            <span>Profil</span>
        </a>
    </nav>

    <script src="/assets/js/data.js"></script>
    <script src="/profile/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
